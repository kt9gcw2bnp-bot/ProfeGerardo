<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso · Tesorería</title>
<style>
:root{
  --navy:#0E1B3D; --navy-deep:#0A1230;
  --gold:#B8863C; --gold-light:#F4DD7A;
  --teal:#2FC2AD; --coral:#EF6A5B;
  --ink:#20242B; --paper:#F3F5F4; --muted:#5B6470; --line:#D8DCDD;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-bottom:60px;}
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.topbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar h1{font-size:15.5px;margin:0 0 2px;}
.topbar p{margin:0;font-size:10px;color:rgba(255,255,255,.65);font-family:var(--mono);letter-spacing:.4px;text-transform:uppercase;}
.teacherBtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:10.5px;padding:5px 10px;border-radius:14px;cursor:pointer;}

.namebar{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.namebar input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;flex:1;min-width:160px;}
.namebar label{font-size:11px;color:var(--muted);font-family:var(--mono);}

.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:16px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#f7f8f6;}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab.done::after{content:" ✓";color:var(--teal);}
.tab.cert{border-color:var(--gold);}
.tab.cert.active{background:var(--gold);color:var(--navy-deep);border-color:var(--gold);}
.tab.tab-locked{opacity:.45;}
.tab.tab-locked::before{content:"🔒 ";}

.info-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;border-radius:12px;padding:22px 20px;margin-bottom:16px;text-align:center;}
.info-hero .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--gold-light);text-transform:uppercase;}
.info-hero h2{margin:8px 0 4px;font-size:19px;}
.info-hero p{margin:0;font-size:12px;color:rgba(255,255,255,.75);}
.info-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;}
.info-block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--block-color,var(--gold));}
.info-block .ib-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.info-block .ib-icon{font-size:22px;flex-shrink:0;}
.info-block h3{margin:0;font-size:14.5px;color:var(--navy);}
.info-block p{font-size:12.5px;line-height:1.6;margin:0 0 8px;color:var(--ink);}
.info-block ul{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.7;color:var(--ink);}
.info-block .ib-tag{display:inline-block;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.5px;background:#f7f8f6;color:var(--muted);padding:2px 8px;border-radius:10px;margin-top:6px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
@media (max-width:480px){.info-grid{grid-template-columns:1fr;}}
.info-mini{background:#f7f8f6;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.info-mini b{display:block;font-size:12px;color:var(--navy);margin-bottom:3px;}
.info-mini span{font-size:11px;color:var(--muted);line-height:1.4;}
.read-confirm{text-align:center;margin:20px 0 6px;}
.read-confirm .btn{padding:12px 26px;font-size:13.5px;}
.read-confirm p{font-size:11.5px;color:var(--muted);margin-top:8px;}

.page{max-width:760px;margin:0 auto;padding:16px;}
.content-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55;color:var(--ink);}
.content-card h2{font-size:16px;margin:0 0 8px;color:var(--navy);}

.actcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.actcard h3{font-size:13.5px;margin:0 0 10px;color:var(--navy);}
.btn{display:inline-block;padding:8px 16px;background:var(--navy);color:#fff;border:none;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--navy-deep);}
.btn:disabled{opacity:.45;cursor:default;}
.scorepill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--teal);color:#fff;padding:3px 10px;border-radius:12px;margin-left:8px;}

.qcard{border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:10px;}
.qcard.correct{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
.qcard.incorrect{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset;}
.qtext{font-size:13px;font-weight:600;margin-bottom:8px;}
.opt{display:flex;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-top:6px;cursor:pointer;font-size:12.5px;}
.opt:hover{background:#f7f8f6;}
.opt .letter{font-family:var(--mono);font-weight:700;color:var(--navy);}
.opt.locked{cursor:default;}
.opt.chosen-correct{background:#e7f1ec;border-color:var(--teal);}
.opt.chosen-incorrect{background:#f7e9e8;border-color:var(--coral);}
.opt.reveal-correct{background:#e7f1ec;border-color:var(--teal);}
.justif{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:11.5px;display:none;}
.justif.show{display:block;}
.justif.ok{background:#e7f1ec;color:#1e4a37;}
.justif.bad{background:#f7e9e8;color:#6f2626;}

.match-table{width:100%;border-collapse:collapse;margin-top:6px;}
.match-table td{padding:6px 4px;font-size:12.5px;vertical-align:middle;}
.match-table select{width:100%;font-size:12.5px;padding:6px;border-radius:5px;border:1px solid var(--line);}
.match-row.ok select{border-color:var(--teal);background:#e7f1ec;}
.match-row.bad select{border-color:var(--coral);background:#f7e9e8;}
.bank{font-size:11px;color:var(--muted);background:#f7f8f6;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;}

.ws-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center;}
.ws-grid{display:grid;gap:1px;background:#dfe3e6;border:2px solid var(--navy);border-radius:6px;padding:3px;touch-action:none;}
.ws-cell{width:19px;height:19px;display:flex;align-items:center;justify-content:center;background:#fff;font-family:var(--mono);font-weight:700;font-size:9.5px;border-radius:2px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.ws-cell.selected{background:var(--gold-light);}
.ws-cell.found{background:var(--teal);color:#fff;}
.ws-list{flex:0 0 170px;}
.ws-list ul{list-style:none;margin:0;padding:0;}
.ws-list li{font-family:var(--mono);font-size:11px;padding:4px 7px;border-radius:5px;margin-bottom:3px;background:#f7f8f6;border:1px solid var(--line);}
.ws-list li.found{background:var(--teal);color:#fff;border-color:var(--teal);text-decoration:line-through;}

.cw-wrap{display:flex;gap:18px;flex-wrap:wrap;}
.cw-grid{display:grid;gap:1px;background:#1c1f24;border:2px solid var(--navy);border-radius:4px;padding:2px;}
.cw-cell{width:22px;height:22px;position:relative;background:#fff;}
.cw-cell.blocked{background:#1c1f24;}
.cw-cell input{width:100%;height:100%;border:none;text-align:center;font-family:var(--mono);font-weight:700;font-size:11.5px;text-transform:uppercase;background:transparent;padding:0;}
.cw-cell input.ok{background:#e7f1ec;color:#1e4a37;}
.cw-cell input.bad{background:#f7e9e8;color:#6f2626;}
.cw-num{position:absolute;top:0px;left:1px;font-size:6.5px;color:var(--gold);font-family:var(--mono);}
.cw-clues{flex:1;min-width:200px;font-size:11.5px;}
.cw-clues b{color:var(--navy);display:block;margin:8px 0 3px;font-size:11px;}
.cw-clues li{margin-bottom:4px;}

.caso-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.caso-card.correct{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
.caso-card.incorrect{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset;}
.caso-card .caso-tag{font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;}
.caso-card p.enunciado{font-size:13px;margin:8px 0 4px;color:var(--ink);}
textarea.caso-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:var(--sans);font-size:12.5px;min-height:60px;margin-top:10px;}
.caso-opts{margin-top:10px;}

.progress-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.progress-table th,.progress-table td{border:1px solid var(--line);padding:7px 9px;font-size:12px;text-align:left;}
.progress-table th{background:var(--navy);color:#fff;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;}
.progress-table td.center{text-align:center;}
.status-ok{color:var(--teal);font-weight:700;}
.status-mid{color:#c98a2c;font-weight:700;}
.status-bad{color:var(--coral);font-weight:700;}
.status-pending{color:var(--muted);}
.competency-desc{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.ra-tag{font-family:var(--mono);font-size:9.5px;color:var(--gold);font-weight:700;}

.certificate{display:none;border:8px double var(--gold);border-radius:10px;padding:34px 24px;text-align:center;background:#fffdf7;margin-top:10px;}
.certificate.show{display:block;}
.certificate .kicker{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.certificate h2{font-size:22px;color:var(--navy);margin:10px 0 4px;font-family:Georgia,serif;}
.certificate .name{font-size:26px;font-weight:700;color:var(--navy-deep);margin:14px 0;font-family:Georgia,serif;border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:6px;}
.certificate p{font-size:12.5px;color:var(--muted);max-width:440px;margin:6px auto;}
.certificate .seal{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d488,#a97c29);margin:14px auto 0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#3a2a06;font-weight:700;}

.locked-msg{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 20px;background:#fff;border:1px dashed var(--line);border-radius:8px;}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,18,48,.6);z-index:50;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:10px;max-width:700px;width:100%;padding:20px;}
.modal h3{margin:0 0 12px;color:var(--navy);}
.modal .close{float:right;cursor:pointer;font-size:18px;color:var(--muted);}
.pin-row{display:flex;gap:8px;margin-top:10px;}
.pin-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--mono);letter-spacing:3px;text-align:center;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <h1>💰 Curso: Tesorería</h1>
      <p>Contabilidad · Undécimo año · Gestión pública</p>
    </div>
    <button class="teacherBtn" id="teacherBtnOpen">👩‍🏫 Panel docente</button>
    <button class="teacherBtn" id="focusModeBtn" style="margin-left:6px;">🔒 Modo enfoque</button>
  </div>
</div>

<div class="namebar">
  <label>Tu nombre:</label>
  <input type="text" id="studentName" placeholder="Nombre completo" maxlength="45">
  <span id="nameStatus" style="font-size:11px;color:var(--muted);font-family:var(--mono);"></span>
</div>

<div class="tabs" id="tabs"></div>

<div class="page" id="page"></div>

<div class="modal-bg" id="pinModalBg">
  <div class="modal">
    <span class="close" id="pinModalClose">✕</span>
    <h3>Panel docente</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0;">Ingrese el PIN para ver el progreso del grupo.</p>
    <div class="pin-row">
      <input type="password" id="pinInput" maxlength="6" placeholder="PIN">
      <button class="btn" id="pinSubmit">Entrar</button>
    </div>
    <div id="pinError" style="color:var(--coral);font-size:11.5px;margin-top:6px;display:none;">PIN incorrecto.</div>
  </div>
</div>

<div class="modal-bg" id="teacherModalBg">
  <div class="modal">
    <span class="close" id="teacherModalClose">✕</span>
    <h3>Panel docente — progreso del curso</h3>
    <div id="teacherContent">Cargando...</div>
  </div>
</div>

<script>
const TEACHER_PIN = "9986";

/* ============================================================
   CONFIGURACIÓN DE MÓDULOS — orden variado a propósito
   (cuestionario primero, luego asocie, sopa de letras, trabajo
   en clase, crucigrama, verdadero/falso, y casos al final)
   ============================================================ */
const MODULES = [
  { id:"tesoreria_antologia", label:"📘 Antología", title:"Antología — Tesorería", activityType:"antologia" },
  { id:"tesoreria_calculo", label:"⚖️ Cuestionario", title:"Conceptos de Tesorería",
    content:"La tesorería es la función encargada de planificar y controlar los flujos de efectivo de la empresa, asegurando la liquidez necesaria para operar día a día.",
    activityType:"quiz" },
  { id:"tesoreria_tipos", label:"🔗 Asocie", title:"Asocie — Documentos de Tesorería", activityType:"matching" },
  { id:"tesoreria_concepto", label:"🔤 Sopa de letras", title:"Vocabulario de Tesorería",
    content:"El proceso de tesorería incluye el ciclo completo de cobros y pagos: entradas de efectivo por cobros a clientes, y salidas por pagos a proveedores, planilla e impuestos.",
    activityType:"wordsearch" },
  { id:"tesoreria_trabajo", label:"📝 Trabajo en clase", title:"Trabajo en clase — ¿Qué documento o herramienta aplica?", activityType:"trabajo" },
  { id:"tesoreria_metodos", label:"🗂️ Crucigrama", title:"Documentos y Conceptos Clave",
    content:"Cada documento de tesorería cumple una función distinta: recibos, cheques, transferencias, letras de cambio y pagarés respaldan de forma diferente los cobros y pagos de la empresa.",
    activityType:"crossword" },
  { id:"tesoreria_vf", label:"✅ Verdadero/Falso", title:"Verdadero o Falso",
    content:"Repasemos con afirmaciones que pueden ser ciertas o falsas — prestá atención a los detalles.",
    activityType:"vf" },
  { id:"tesoreria_casos", label:"💬 Casos y Debate", title:"Casos y Debate (módulo compartido)", activityType:"casos" },
  { id:"certificado", label:"🏆 Certificado", title:"Certificado", activityType:"certificado" },
];

const ORDER = ["tesoreria_antologia","tesoreria_calculo","tesoreria_tipos","tesoreria_concepto","tesoreria_trabajo","tesoreria_metodos","tesoreria_vf","tesoreria_casos"];

function isStepDone(id){
  if(id==='tesoreria_antologia') return antologiaLeida;
  if(id==='tesoreria_casos') return !!(localProgress['tesoreria_casos'] && localProgress['tesoreria_casos'].score>0);
  return !!(localProgress[id] && localProgress[id].total > 0);
}

function currentStepIndex(){
  for(let i=0;i<ORDER.length;i++){ if(!isStepDone(ORDER[i])) return i; }
  return ORDER.length;
}

let activeModule = MODULES[0].id;
let studentName = "";
let antologiaLeida = false;

/* ============================================================
   CONEXIÓN A GOOGLE SHEETS (vía Apps Script Web App)
   ============================================================ */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzMGf_Gpf6UWswFPSqEBMdq-93GxGkrURsT4jtO9Jaz8yT5gyMMtp1btlcDZjRCeuAb/exec";

function sheetsReady(){ return SHEET_API_URL && !SHEET_API_URL.startsWith('REEMPLAZAR'); }

let jsonpCounter = 0;
function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const cleanup = ()=>{ delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); };
    window[cbName] = (data)=>{ settled = true; cleanup(); resolve(data); };
    script.onerror = ()=>{ if(!settled){ cleanup(); reject(new Error('Error de red (JSONP)')); } };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(!settled){ cleanup(); reject(new Error('Tiempo de espera agotado')); } }, 10000);
  });
}

async function sheetGet(sheetName){
  const data = await jsonpRequest(SHEET_API_URL + '?sheet=' + encodeURIComponent(sheetName));
  return data.rows || [];
}

async function sheetPost(sheetName, row){
  await fetch(SHEET_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ sheet: sheetName, row })
  });
  return { ok:true };
}

/* ============================================================
   PROGRESO
   ============================================================ */
const localProgress = {};

async function saveProgress(moduleId, score, total){
  localProgress[moduleId] = {score, total, ts:Date.now()};
  renderTabs();
  if(!studentName || !sheetsReady()) return;
  try{
    const nowIso = new Date().toISOString();
    await sheetPost('Progreso', [nowIso, studentName, moduleId, score, total]);
  }catch(e){}
}

/* ============================================================
   ANTI-REINTENTO
   ============================================================ */
function isLocked(moduleId){
  return !!(localProgress[moduleId] && localProgress[moduleId].total > 0);
}

function renderLockedNotice(moduleId, activityLabel){
  const p = localProgress[moduleId];
  const pctVal = p.total>0 ? Math.round((p.score/p.total)*100) : 0;
  const card = document.createElement('div');
  card.className = 'actcard';
  card.innerHTML = `<h3>✅ Actividad completada</h3>
    <p style="font-size:13px;">Ya completaste <strong>${activityLabel}</strong>. Tu resultado fue <strong>${p.score} / ${p.total}</strong> (${pctVal}%).</p>
    <p style="font-size:11px;color:var(--muted);">Esta actividad ya quedó registrada y no se puede repetir.</p>`;
  pageEl.appendChild(card);
}

async function loadExistingProgress(){
  if(!studentName || !sheetsReady()) return;
  try{
    const rows = await sheetGet('Progreso');
    rows.filter(r => r.Estudiante === studentName).forEach(r=>{
      const mod = r.Modulo;
      if(!mod) return;
      localProgress[mod] = { score:Number(r.Score), total:Number(r.Total), ts:new Date(r.Timestamp).getTime() };
    });
    if(localProgress['tesoreria_antologia']) antologiaLeida = true;
    renderTabs();
    renderPage();
  }catch(e){}
}

/* ============================================================
   TABS
   ============================================================ */
const tabsEl = document.getElementById('tabs');
function renderTabs(){
  tabsEl.innerHTML = '';
  const curIdx = currentStepIndex();
  MODULES.forEach(m=>{
    const t = document.createElement('div');
    const done = isStepDone(m.id);
    const orderIdx = ORDER.indexOf(m.id);
    let clickable;
    if(m.id==='certificado' || m.id==='tesoreria_antologia') clickable = true;
    else clickable = (orderIdx === curIdx);
    t.className = 'tab' + (m.id===activeModule?' active':'') + (done?' done':'') + (m.id==='certificado'?' cert':'') + (!clickable?' tab-locked':'');
    t.textContent = m.label;
    t.addEventListener('click', ()=>{
      if(!clickable){
        if(orderIdx > curIdx) alert('Primero debés completar la actividad actual antes de avanzar a esta.');
        else alert('Ya completaste esta actividad — solo podés regresar a la Antología, no a etapas anteriores.');
        return;
      }
      activeModule = m.id;
      renderTabs(); renderPage();
    });
    tabsEl.appendChild(t);
  });
}

/* ============================================================
   RENDER PAGE ROUTER
   ============================================================ */
const pageEl = document.getElementById('page');
function renderPage(){
  const m = MODULES.find(x=>x.id===activeModule);
  pageEl.innerHTML = '';
  if(m.content){
    const c = document.createElement('div');
    c.className = 'content-card';
    c.innerHTML = `<h2>${m.title}</h2><p>${m.content}</p>`;
    pageEl.appendChild(c);
  }
  if(m.activityType==='antologia') renderAntologia();
  else if(m.activityType==='wordsearch') renderWordSearch();
  else if(m.activityType==='crossword') renderCrossword();
  else if(m.activityType==='quiz') renderQuiz();
  else if(m.activityType==='vf') renderVF();
  else if(m.activityType==='matching') renderMatching();
  else if(m.activityType==='trabajo') renderTrabajo();
  else if(m.activityType==='casos') renderCasos();
  else if(m.activityType==='certificado') renderCertificado();
  maybeShowContinue();
}

function maybeShowContinue(){
  if(activeModule==='certificado') return;
  if(!isStepDone(activeModule)) return;
  const idx = ORDER.indexOf(activeModule);
  if(idx===-1) return;
  const nextId = (idx+1<ORDER.length) ? ORDER[idx+1] : 'certificado';
  const nextMod = MODULES.find(x=>x.id===nextId);
  const bar = document.createElement('div');
  bar.className = 'read-confirm';
  bar.innerHTML = `<button class="btn" id="continueBtn">➡️ Continuar a: ${nextMod.label}</button>`;
  pageEl.appendChild(bar);
  document.getElementById('continueBtn').addEventListener('click', ()=>{
    activeModule = nextId; renderTabs(); renderPage();
  });
}

function renderAntologia(){

  card.innerHTML = `

      <div class="ib-head"><span class="ib-icon">💰</span><h3>1. ¿Qué es la Tesorería?</h3></div>
      <p>La <strong>tesorería</strong> es la función administrativa encargada de planificar, organizar y controlar el efectivo de la empresa. Su objetivo central es garantizar la <strong>liquidez</strong>: que siempre haya suficiente dinero disponible para cumplir con las obligaciones del día a día, sin caer en faltantes ni acumular excesos improductivos de efectivo ocioso.</p>
      <p>Según el programa oficial de estudio, esta unidad busca que el estudiante pueda <strong>"diagramar procesos de tesorería para la administración del dinero a través del presupuesto, según la normativa contable, comercial y bancaria vigente"</strong> — por eso cada decisión de tesorería debe respaldarse en la ley y en criterios técnicos, no en el criterio personal de quien administra el dinero.</p>
      <p>Quien ejerce esta función —a menudo llamado tesorero o encargado de tesorería— debe anticipar necesidades de efectivo antes de que ocurran, negociar condiciones de pago y cobro con clientes y proveedores, custodiar los fondos de la empresa frente a riesgos de pérdida o fraude, y coordinar constantemente con bancos, clientes y proveedores.</p>
      <span class="ib-tag">RA3 · Gestión pública</span>
    </div>

    <div class="info-block" style="--block-color:#2FC2AD;">
      <div class="ib-head"><span class="ib-icon">🔄</span><h3>2. El ciclo de cobros y pagos</h3></div>
      <div class="info-grid">
        <div class="info-mini"><b>Cobros (entradas)</b><span>Dinero que ingresa por ventas a crédito ya cobradas, ventas de contado, préstamos recibidos, o cualquier otra fuente de ingresos de efectivo.</span></div>
        <div class="info-mini"><b>Pagos (salidas)</b><span>Dinero que sale para pagar a proveedores, planilla, impuestos, servicios públicos y otros compromisos adquiridos por la empresa.</span></div>
      </div>
      <p>Administrar bien este ciclo evita que la empresa se quede sin efectivo justo cuando lo necesita. Este es un punto clave que muchas veces se malentiende: <strong>una empresa puede ser perfectamente rentable en el papel —vendiendo bien y con buenas utilidades— y aun así quedarse sin efectivo</strong>, si sus cobros llegan más tarde que sus pagos. Por ejemplo, si vende mucho a crédito a 60 días pero debe pagar planilla cada quincena, puede enfrentar un problema de liquidez aunque sus ventas totales sean excelentes.</p>
      <p>Por eso la tesorería no se pregunta solamente "¿cuánto gana o debe la empresa?", sino sobre todo "¿en qué momento exacto entra y sale ese dinero?" — la sincronización en el tiempo es tan importante como el monto total.</p>
      <span class="ib-tag">RA3 · Gestión pública</span>
    </div>

    <div class="info-block" style="--block-color:#0E1B3D;">
      <div class="ib-head"><span class="ib-icon">📄</span><h3>3. Documentos de tesorería</h3></div>
      <p>Cada operación de cobro o pago debe quedar respaldada con el documento correcto, según lo que exige la normativa comercial y bancaria vigente:</p>
      <ul>
        <li><strong>Recibo</strong> — comprobante que certifica que se recibió un pago o un bien, protegiendo tanto a quien paga como a quien cobra.</li>
        <li><strong>Transferencia bancaria</strong> — movimiento electrónico de fondos entre cuentas, cada vez más usado por su rapidez y trazabilidad.</li>
        <li><strong>Cheque</strong> — orden de pago girada por el titular de una cuenta corriente, a favor de un beneficiario, para que el banco pague la suma indicada contra los fondos disponibles.</li>
        <li><strong>Letra de cambio</strong> — una persona (el girador) ordena a otra (el girado) pagar una suma a un tercero (el beneficiario), en una fecha determinada. Involucra a tres partes distintas.</li>
        <li><strong>Pagaré</strong> — quien firma se compromete <em>directamente</em> a pagar una suma en una fecha determinada, sin que exista una tercera persona dando la orden. Es más simple que la letra de cambio porque solo involucra a dos partes.</li>
      </ul>
      <p>La diferencia entre letra de cambio y pagaré es una de las más consultadas: en la letra, alguien <em>ordena</em> a un tercero pagar; en el pagaré, quien firma <em>se compromete él mismo</em> a pagar.</p>
      <span class="ib-tag">RA3 · Gestión pública</span>
    </div>

    <div class="info-block" style="--block-color:#EF6A5B;">
      <div class="ib-head"><span class="ib-icon">📒</span><h3>4. Libro de caja y cuentas por cobrar</h3></div>
      <p>El <strong>libro de caja</strong> registra de forma cronológica todas las entradas y salidas de efectivo de la empresa: cada colón que entra y cada colón que sale queda anotado en el momento en que ocurre, con su fecha, su monto y su concepto. Esto permite conocer en cualquier instante cuánto efectivo tiene realmente disponible la empresa, y detectar rápidamente cualquier diferencia o error.</p>
      <p>El control de <strong>cuentas por cobrar</strong> hace lo mismo, pero con el dinero que los clientes deben a la empresa por ventas realizadas a crédito. Llevar un buen control de a quién se le vendió, cuánto debe y cuándo vence su pago permite a la tesorería anticipar con precisión cuándo va a recibir ese dinero — información clave para no quedarse sin liquidez.</p>
      <span class="ib-tag">RA3 · Gestión pública</span>
    </div>

    <div class="info-block" style="--block-color:#B8863C;">
      <div class="ib-head"><span class="ib-icon">📊</span><h3>5. Presupuesto de tesorería</h3></div>
      <p>Es una <strong>proyección</strong> de los ingresos y egresos de efectivo esperados para un período futuro —una semana, un mes, un trimestre—. Permite anticipar momentos en los que podría faltar liquidez, y planificar con tiempo cómo cubrir esa necesidad: negociando plazos más largos con un proveedor, gestionando un crédito bancario a tiempo, o simplemente postergando un gasto no urgente.</p>
      <div class="formula-box">Saldo inicial + Cobros esperados − Pagos programados = Saldo final proyectado</div>
      <p style="margin-top:8px;">Si ese saldo final proyectado sale negativo o insuficiente, la empresa lo sabe con anticipación y puede actuar — en lugar de descubrirlo el mismo día en que no le alcanza para pagar.</p>

function renderWordSearch(){
  if(isLocked('tesoreria_concepto')){
    renderLockedNotice('tesoreria_concepto', 'la sopa de letras');
    return;
  }
  const card = document.createElement('div');
  card.className = 'actcard';
  const total = Object.keys(WS_DATA.words).length;
  const cellPx = WS_DATA.size > 16 ? 15 : 19;
  card.innerHTML = `<h3>Sopa de letras — encontrá los ${total} términos <span class="scorepill" id="wsScorePill">0 / ${total}</span></h3>
    <div class="ws-wrap">
      <div class="ws-grid" id="wsGrid" style="grid-template-columns:repeat(${WS_DATA.size},${cellPx}px);"></div>
      <div class="ws-list"><ul id="wsList"></ul></div>
    </div>`;
  pageEl.appendChild(card);

  const gridEl = document.getElementById('wsGrid');
  const cells = [];
  for(let r=0;r<WS_DATA.size;r++){
    const row=[];
    for(let c=0;c<WS_DATA.size;c++){
      const div = document.createElement('div');
      div.className='ws-cell';
      div.style.width = cellPx+'px';
      div.style.height = cellPx+'px';
      div.style.fontSize = (WS_DATA.size>16 ? '7.5px' : '9.5px');
      div.textContent = WS_DATA.grid[r][c];
      div.dataset.r=r; div.dataset.c=c;
      gridEl.appendChild(div);
      row.push(div);
    }
    cells.push(row);
  }
  const wordKeys = Object.keys(WS_DATA.words);
  const wordCellSet = {};
  wordKeys.forEach(w=>{ wordCellSet[w] = new Set(WS_DATA.words[w].map(([r,c])=>r+','+c)); });
  const listEl = document.getElementById('wsList');
  const liByWord = {};
  wordKeys.slice().sort().forEach(w=>{
    const li = document.createElement('li');
    li.textContent = w;
    listEl.appendChild(li);
    liByWord[w]=li;
  });

  let found=0;
  let selecting=false, path=[];
  function keyOf(r,c){return r+','+c;}
  function clearSel(){ path.forEach(([r,c])=>{ if(!cells[r][c].classList.contains('found')) cells[r][c].classList.remove('selected'); }); }
  function tryMatch(){
    const selSet = new Set(path.map(([r,c])=>keyOf(r,c)));
    for(const w of wordKeys){
      if(liByWord[w].classList.contains('found')) continue;
      const wSet = wordCellSet[w];
      if(wSet.size!==selSet.size) continue;
      let match=true;
      for(const k of wSet){ if(!selSet.has(k)){match=false;break;} }
      if(match){
        WS_DATA.words[w].forEach(([r,c])=>{ cells[r][c].classList.add('found'); cells[r][c].classList.remove('selected'); });
        liByWord[w].classList.add('found');
        found++;
        document.getElementById('wsScorePill').textContent = found+' / '+total;
        if(found===total){ saveProgress('tesoreria_concepto', found, total); maybeShowContinue(); }
        return true;
      }
    }
    return false;
  }
  function startSel(r,c){ selecting=true; path=[[r,c]]; cells[r][c].classList.add('selected'); }
  function moveSel(r,c){
    if(!selecting) return;
    const [r0,c0]=path[0];
    const dr=r-r0, dc=c-c0;
    if(dr!==0 && dc!==0 && Math.abs(dr)!==Math.abs(dc)) return;
    const steps=Math.max(Math.abs(dr),Math.abs(dc));
    const sdr=steps===0?0:Math.sign(dr), sdc=steps===0?0:Math.sign(dc);
    clearSel(); path=[];
    for(let i=0;i<=steps;i++){
      const rr=r0+sdr*i, cc=c0+sdc*i;
      if(rr<0||rr>=WS_DATA.size||cc<0||cc>=WS_DATA.size) break;
      path.push([rr,cc]);
      cells[rr][cc].classList.add('selected');
    }
  }
  function endSel(){ if(!selecting) return; selecting=false; if(!tryMatch()) clearSel(); path=[]; }
  gridEl.addEventListener('mousedown', e=>{ const t=e.target.closest('.ws-cell'); if(t) startSel(+t.dataset.r,+t.dataset.c); });
  gridEl.addEventListener('mouseover', e=>{ const t=e.target.closest('.ws-cell'); if(t) moveSel(+t.dataset.r,+t.dataset.c); });
  document.addEventListener('mouseup', endSel);
  gridEl.addEventListener('touchstart', e=>{ const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY); const c=t&&t.closest('.ws-cell'); if(c) startSel(+c.dataset.r,+c.dataset.c); }, {passive:true});
  gridEl.addEventListener('touchmove', e=>{ const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY); const c=t&&t.closest('.ws-cell'); if(c) moveSel(+c.dataset.r,+c.dataset.c); }, {passive:true});
  document.addEventListener('touchend', endSel);
}

const CW_DATA = {"size": {"rows": 16, "cols": 15}, "grid": [".............", "......CAJA.....", "......H........", "......E........", "......Q.P......", "......U.R......", ".....TESORERIA.", "........V......", ".PRESUPUESTO...", ".A......E......", ".G.LIQUIDEZ....", ".A......O......", ".R......R......", ".E....EFECTIVO.", "........S......", "..............."], "words": [{"word": "PRESUPUESTO", "clue": "Proyeccion de los ingresos y egresos de efectivo para anticipar necesidades de liquidez", "row": 8, "col": 1, "dir": "H", "num": 4}, {"word": "PROVEEDORES", "clue": "Terceros a quienes la empresa debe pagar por bienes o servicios recibidos", "row": 4, "col": 8, "dir": "V", "num": 2}, {"word": "TESORERIA", "clue": "Funcion encargada de planificar y controlar los flujos de efectivo de la empresa", "row": 6, "col": 5, "dir": "H", "num": 3}, {"word": "LIQUIDEZ", "clue": "Capacidad de la empresa para cubrir sus obligaciones de corto plazo con el efectivo disponible", "row": 10, "col": 3, "dir": "H", "num": 5}, {"word": "EFECTIVO", "clue": "Dinero disponible de forma inmediata para realizar pagos", "row": 13, "col": 6, "dir": "H", "num": 6}, {"word": "CHEQUE", "clue": "Orden de pago girada contra una cuenta bancaria a favor de un beneficiario", "row": 1, "col": 6, "dir": "V", "num": 1}, {"word": "PAGARE", "clue": "Documento donde el firmante se compromete directamente a pagar una suma en una fecha determinada", "row": 8, "col": 1, "dir": "V", "num": 4}, {"word": "CAJA", "clue": "Libro que registra de forma cronologica las entradas y salidas de efectivo", "row": 1, "col": 6, "dir": "H", "num": 1}]};

function renderCrossword(){
  if(isLocked('tesoreria_metodos')){
    renderLockedNotice('tesoreria_metodos', 'el crucigrama');
    return;
  }
  const card = document.createElement('div');
  card.className = 'actcard';
  const across = CW_DATA.words.filter(w=>w.dir==='H').sort((a,b)=>a.num-b.num);
  const down = CW_DATA.words.filter(w=>w.dir==='V').sort((a,b)=>a.num-b.num);
  card.innerHTML = `<h3>Crucigrama — completá según las pistas <span class="scorepill" id="cwScorePill">0%</span></h3>
    <div class="cw-wrap">
      <div class="cw-grid" id="cwGrid" style="grid-template-columns:repeat(${CW_DATA.size.cols},22px);"></div>
      <div class="cw-clues">
        <b>Horizontales</b><ul id="cwAcross"></ul>
        <b>Verticales</b><ul id="cwDown"></ul>
      </div>
    </div>
    <button class="btn" id="cwCheckBtn" style="margin-top:12px;">Comprobar crucigrama</button>`;
  pageEl.appendChild(card);

  document.getElementById('cwAcross').innerHTML = across.map(w=>`<li><b>${w.num}.</b> ${w.clue}</li>`).join('');
  document.getElementById('cwDown').innerHTML = down.map(w=>`<li><b>${w.num}.</b> ${w.clue}</li>`).join('');

  const R = CW_DATA.size.rows, C = CW_DATA.size.cols;
  const gridEl = document.getElementById('cwGrid');
  const numAt = {};
  CW_DATA.words.forEach(w=>{ numAt[w.row+','+w.col] = w.num; });
  const inputs = {};
  for(let r=0;r<R;r++){
    for(let c=0;c<C;c++){
      const ch = CW_DATA.grid[r][c];
      const cell = document.createElement('div');
      if(ch==='.'){
        cell.className='cw-cell blocked';
      } else {
        cell.className='cw-cell';
        const key = numAt[r+','+c];
        if(key) cell.innerHTML = `<span class="cw-num">${key}</span>`;
        const inp = document.createElement('input');
        inp.maxLength=1;
        inp.dataset.r=r; inp.dataset.c=c;
        inp.addEventListener('input', function(){
          this.value = this.value.toUpperCase().replace(/[^A-ZÑ]/g,'');
          if(this.value){
            const next = findNextInput(r,c);
            if(next) next.focus();
          }
        });
        cell.appendChild(inp);
        inputs[r+','+c] = inp;
      }
      gridEl.appendChild(cell);
    }
  }
  function findNextInput(r,c){
    if(inputs[r+','+(c+1)]) return inputs[r+','+(c+1)];
    if(inputs[(r+1)+','+c]) return inputs[(r+1)+','+c];
    return null;
  }

  document.getElementById('cwCheckBtn').addEventListener('click', ()=>{
    let correct=0, total=0;
    for(const key in inputs){
      const [r,c] = key.split(',').map(Number);
      const expected = CW_DATA.grid[r][c];
      const inp = inputs[key];
      total++;
      if(inp.value === expected){ inp.classList.add('ok'); inp.classList.remove('bad'); correct++; }
      else{ inp.classList.add('bad'); inp.classList.remove('ok'); }
    }
    document.getElementById('cwScorePill').textContent = Math.round((correct/total)*100)+'%';
    saveProgress('tesoreria_metodos', correct, total);
    maybeShowContinue();
  });
}

function competencyScore(comp){
  let sum=0, total=0, anyData=false;
  comp.modules.forEach(mid=>{
    const p = localProgress[mid];
    if(p){ sum+=p.score; total+=p.total; anyData=true; }
  });
  return { sum, total, pct: anyData && total>0 ? Math.round((sum/total)*100) : null };
}

function competencyLevel(pctVal){
  if(pctVal===null) return { label:"Sin evidencia", cls:"status-pending" };
  if(pctVal<=50) return { label:"No logrado", cls:"status-bad" };
  if(pctVal<=80) return { label:"En proceso", cls:"status-mid" };
  return { label:"Logrado", cls:"status-ok" };
}

    rows += `<tr>

  const content = document.getElementById('teacherContent');
  content.innerHTML = 'Cargando...';
  if(!sheetsReady()){
    content.innerHTML = '<p style="font-size:12.5px;color:var(--coral);">⚠️ Falta configurar la conexión a la hoja de datos (SHEET_API_URL) en este archivo.</p>';
    return;
  }
  try{
    const progRows = await sheetGet('Progreso');
    const byStudent = {};
    progRows.forEach(r=>{
      const name = r.Estudiante, mod = r.Modulo;
      if(!name || !mod) return;
      byStudent[name] = byStudent[name] || {};
      byStudent[name][mod] = { score:Number(r.Score), total:Number(r.Total) };
    });

    const names = Object.keys(byStudent).sort();
    if(names.length===0){ content.innerHTML = '<p style="font-size:12.5px;color:var(--muted);">Todavía no hay estudiantes con progreso guardado.</p>'; return; }
    const levelAbbrev = (pctVal)=>{
      if(pctVal===null) return '—';
      const lvl = competencyLevel(pctVal);
      const short = {"Logrado":"✓ Logrado","En proceso":"◐ En proceso","No logrado":"✕ No logrado"}[lvl.label] || lvl.label;
      return `<span class="${lvl.cls}">${short}</span>`;
    };
    let html = '<p style="font-size:10.5px;color:var(--muted);margin-top:0;">Nivel por indicador: 0–50% No logrado · 51–80% En proceso · 81–100% Logrado.</p>';
    html += '<table class="progress-table"><tr><th>Estudiante</th><th>Antología</th><th>RA1</th><th>RA2</th><th>RA3 Trabajo</th><th>Casos</th><th>Salidas</th></tr>';
    names.forEach(n=>{
      const d = byStudent[n];
      const compPct = (mods)=>{
        let sum=0,total=0,any=false;
        mods.forEach(mid=>{ const x=d[mid]; if(x){ sum+=x.score; total+=x.total; any=true; } });
        return any && total>0 ? Math.round((sum/total)*100) : null;
      };
      const okCell = (obj)=> obj ? (obj.score>0 ? '<span class="status-ok">✓ Logrado</span>' : '<span class="status-pending">Sin evidencia</span>') : '—';
      const salidas = d.incidente_salida_pantalla ? d.incidente_salida_pantalla.score : 0;
      const salidasCell = salidas > 0 ? `<span class="status-bad">⚠️ ${salidas}</span>` : '<span class="status-pending">0</span>';
      html += `<tr>
        <td>${escapeHtml(n)}</td>
        <td class="center">${okCell(d.tesoreria_antologia)}</td>
        <td class="center">${levelAbbrev(compPct(['tesoreria_calculo']))}</td>
        <td class="center">${levelAbbrev(compPct(['tesoreria_tipos','tesoreria_metodos','tesoreria_vf']))}</td>
        <td class="center">${levelAbbrev(compPct(['tesoreria_trabajo']))}</td>
        <td class="center">${okCell(d.tesoreria_casos)}</td>
        <td class="center">${salidasCell}</td>
      </tr>`;
    });
    html += '</table>';
    content.innerHTML = html;
  }catch(e){
    content.innerHTML = '<p style="font-size:12.5px;color:var(--coral);">No se pudo cargar el panel (revisá la conexión a la hoja de datos).</p>';
  }
}
document.getElementById('teacherModalClose').addEventListener('click', ()=>{
  document.getElementById('teacherModalBg').classList.remove('show');
});

/* ============================================================
   NOMBRE DEL ESTUDIANTE
   ============================================================ */
document.getElementById('studentName').addEventListener('input', function(){
  studentName = this.value.trim();
  document.getElementById('nameStatus').textContent = studentName ? '● identificado' : '';
});
document.getElementById('studentName').addEventListener('change', function(){
  if(studentName) loadExistingProgress();
});

/* ============================================================
   PRELLENADO DESDE UN ENLACE (?nombre=...)
   ============================================================ */
(function prefillFromLink(){
  const params = new URLSearchParams(window.location.search);
  const nombreParam = params.get('nombre');
  if(nombreParam){
    studentName = nombreParam;
    document.getElementById('studentName').value = nombreParam;
    document.getElementById('nameStatus').textContent = '● identificado';
    loadExistingProgress();
  }
})();

/* ============================================================
   MODO ENFOQUE: pantalla completa + detección de salidas
   ============================================================ */
let salidaCount = 0;
document.getElementById('focusModeBtn').addEventListener('click', ()=>{
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req) req.call(el).catch(()=>{});
});

function showWarnBanner(msg){
  let banner = document.getElementById('warnBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'warnBanner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:200;background:#EF6A5B;color:#fff;text-align:center;padding:8px 12px;font-size:12.5px;font-family:monospace;';
    document.body.prepend(banner);
  }
  banner.textContent = msg;
  banner.style.display = 'block';
  clearTimeout(window._warnTimeout);
  window._warnTimeout = setTimeout(()=>{ banner.style.display='none'; }, 6000);
}

function logSalida(){
  salidaCount++;
  showWarnBanner('⚠️ Se detectó que saliste de esta pestaña o ventana (van: ' + salidaCount + ').');
  if(studentName && sheetsReady()){
    sheetPost('Progreso', [new Date().toISOString(), studentName, 'incidente_salida_pantalla', salidaCount, salidaCount]).catch(()=>{});
  }
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) logSalida(); });

window.addEventListener('beforeunload', function(e){
  e.preventDefault();
  e.returnValue = '';
});

document.addEventListener('contextmenu', e=> e.preventDefault());
document.addEventListener('copy', e=> e.preventDefault());

/* ============================================================
   INICIO
   ============================================================ */
renderTabs();
renderPage();
</script>
