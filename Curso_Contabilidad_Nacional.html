<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso · Contabilidad Nacional</title>
<style>
:root{
  --navy:#0E1B3D; --navy-deep:#0A1230;
  --gold:#B8863C; --gold-light:#F4DD7A;
  --teal:#2FC2AD; --coral:#EF6A5B;
  --ink:#20242B; --paper:#F3F5F4; --muted:#5B6470; --line:#D8DCDD;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-bottom:60px;}
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.topbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar h1{font-size:15.5px;margin:0 0 2px;}
.topbar p{margin:0;font-size:10px;color:rgba(255,255,255,.65);font-family:var(--mono);letter-spacing:.4px;text-transform:uppercase;}
.teacherBtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:10.5px;padding:5px 10px;border-radius:14px;cursor:pointer;}

.namebar{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.namebar input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;flex:1;min-width:160px;}
.namebar label{font-size:11px;color:var(--muted);font-family:var(--mono);}

.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:16px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#f7f8f6;}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab.done::after{content:" ✓";color:var(--teal);}
.tab.cert{border-color:var(--gold);}
.tab.cert.active{background:var(--gold);color:var(--navy-deep);border-color:var(--gold);}
.tab.tab-locked{opacity:.45;}
.tab.tab-locked::before{content:"🔒 ";}

.info-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;border-radius:12px;padding:22px 20px;margin-bottom:16px;text-align:center;}
.info-hero .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--gold-light);text-transform:uppercase;}
.info-hero h2{margin:8px 0 4px;font-size:19px;}
.info-hero p{margin:0;font-size:12px;color:rgba(255,255,255,.75);}
.info-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;}
.info-block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--block-color,var(--gold));}
.info-block .ib-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.info-block .ib-icon{font-size:22px;flex-shrink:0;}
.info-block h3{margin:0;font-size:14.5px;color:var(--navy);}
.info-block p{font-size:12.5px;line-height:1.6;margin:0 0 8px;color:var(--ink);}
.info-block ul{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.7;color:var(--ink);}
.info-block .ib-tag{display:inline-block;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.5px;background:#f7f8f6;color:var(--muted);padding:2px 8px;border-radius:10px;margin-top:6px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
@media (max-width:480px){.info-grid{grid-template-columns:1fr;}}
.info-mini{background:#f7f8f6;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.info-mini b{display:block;font-size:12px;color:var(--navy);margin-bottom:3px;}
.info-mini span{font-size:11px;color:var(--muted);line-height:1.4;}
.read-confirm{text-align:center;margin:20px 0 6px;}
.read-confirm .btn{padding:12px 26px;font-size:13.5px;}
.read-confirm p{font-size:11.5px;color:var(--muted);margin-top:8px;}

.page{max-width:760px;margin:0 auto;padding:16px;}
.content-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55;color:var(--ink);}
.content-card h2{font-size:16px;margin:0 0 8px;color:var(--navy);}

.actcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.actcard h3{font-size:13.5px;margin:0 0 10px;color:var(--navy);}
.btn{display:inline-block;padding:8px 16px;background:var(--navy);color:#fff;border:none;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--navy-deep);}
.btn:disabled{opacity:.45;cursor:default;}
.scorepill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--teal);color:#fff;padding:3px 10px;border-radius:12px;margin-left:8px;}

.qcard{border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:10px;}
.qcard.correct{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
.qcard.incorrect{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset;}
.qtext{font-size:13px;font-weight:600;margin-bottom:8px;}
.opt{display:flex;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-top:6px;cursor:pointer;font-size:12.5px;}
.opt:hover{background:#f7f8f6;}
.opt .letter{font-family:var(--mono);font-weight:700;color:var(--navy);}
.opt.locked{cursor:default;}
.opt.chosen-correct{background:#e7f1ec;border-color:var(--teal);}
.opt.chosen-incorrect{background:#f7e9e8;border-color:var(--coral);}
.opt.reveal-correct{background:#e7f1ec;border-color:var(--teal);}
.justif{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:11.5px;display:none;}
.justif.show{display:block;}
.justif.ok{background:#e7f1ec;color:#1e4a37;}
.justif.bad{background:#f7e9e8;color:#6f2626;}

.match-table{width:100%;border-collapse:collapse;margin-top:6px;}
.match-table td{padding:6px 4px;font-size:12.5px;vertical-align:middle;}
.match-table select{width:100%;font-size:12.5px;padding:6px;border-radius:5px;border:1px solid var(--line);}
.match-row.ok select{border-color:var(--teal);background:#e7f1ec;}
.match-row.bad select{border-color:var(--coral);background:#f7e9e8;}
.bank{font-size:11px;color:var(--muted);background:#f7f8f6;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;}

.ws-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center;}
.ws-grid{display:grid;gap:1px;background:#dfe3e6;border:2px solid var(--navy);border-radius:6px;padding:3px;touch-action:none;}
.ws-cell{width:19px;height:19px;display:flex;align-items:center;justify-content:center;background:#fff;font-family:var(--mono);font-weight:700;font-size:9.5px;border-radius:2px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.ws-cell.selected{background:var(--gold-light);}
.ws-cell.found{background:var(--teal);color:#fff;}
.ws-list{flex:0 0 170px;}
.ws-list ul{list-style:none;margin:0;padding:0;}
.ws-list li{font-family:var(--mono);font-size:11px;padding:4px 7px;border-radius:5px;margin-bottom:3px;background:#f7f8f6;border:1px solid var(--line);}
.ws-list li.found{background:var(--teal);color:#fff;border-color:var(--teal);text-decoration:line-through;}

.cw-wrap{display:flex;gap:18px;flex-wrap:wrap;}
.cw-grid{display:grid;gap:1px;background:#1c1f24;border:2px solid var(--navy);border-radius:4px;padding:2px;}
.cw-cell{width:22px;height:22px;position:relative;background:#fff;}
.cw-cell.blocked{background:#1c1f24;}
.cw-cell input{width:100%;height:100%;border:none;text-align:center;font-family:var(--mono);font-weight:700;font-size:11.5px;text-transform:uppercase;background:transparent;padding:0;}
.cw-cell input.ok{background:#e7f1ec;color:#1e4a37;}
.cw-cell input.bad{background:#f7e9e8;color:#6f2626;}
.cw-num{position:absolute;top:0px;left:1px;font-size:6.5px;color:var(--gold);font-family:var(--mono);}
.cw-clues{flex:1;min-width:200px;font-size:11.5px;}
.cw-clues b{color:var(--navy);display:block;margin:8px 0 3px;font-size:11px;}
.cw-clues li{margin-bottom:4px;}

.caso-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.caso-card.correct{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
.caso-card.incorrect{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset;}
.caso-card .caso-tag{font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;}
.caso-card p.enunciado{font-size:13px;margin:8px 0 4px;color:var(--ink);}
textarea.caso-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:var(--sans);font-size:12.5px;min-height:60px;margin-top:10px;}
.caso-opts{margin-top:10px;}

.progress-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.progress-table th,.progress-table td{border:1px solid var(--line);padding:7px 9px;font-size:12px;text-align:left;}
.progress-table th{background:var(--navy);color:#fff;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;}
.progress-table td.center{text-align:center;}
.status-ok{color:var(--teal);font-weight:700;}
.status-mid{color:#c98a2c;font-weight:700;}
.status-bad{color:var(--coral);font-weight:700;}
.status-pending{color:var(--muted);}
.competency-desc{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.ra-tag{font-family:var(--mono);font-size:9.5px;color:var(--gold);font-weight:700;}

.certificate{display:none;border:8px double var(--gold);border-radius:10px;padding:34px 24px;text-align:center;background:#fffdf7;margin-top:10px;}
.certificate.show{display:block;}
.certificate .kicker{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.certificate h2{font-size:22px;color:var(--navy);margin:10px 0 4px;font-family:Georgia,serif;}
.certificate .name{font-size:26px;font-weight:700;color:var(--navy-deep);margin:14px 0;font-family:Georgia,serif;border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:6px;}
.certificate p{font-size:12.5px;color:var(--muted);max-width:440px;margin:6px auto;}
.certificate .seal{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d488,#a97c29);margin:14px auto 0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#3a2a06;font-weight:700;}

.empresa-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.empresa-tab{flex:0 0 auto;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#fff;}
.empresa-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.rubric-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:11px;}
.rubric-table th,.rubric-table td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;}
.rubric-table th{background:var(--navy);color:#fff;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;}
.rubric-table td.lvl1{background:#fdf0ee;}
.rubric-table td.lvl2{background:#fdf6e8;}
.rubric-table td.lvl3{background:#eaf7f3;}

/* ============ JUEGO: Aventura de Plataformas ============ */
.gamebox{position:relative;width:100%;height:280px;background:linear-gradient(180deg,#bfe3f2 0%,#eaf6ee 75%);border:2px solid var(--navy);border-radius:10px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
.av-world{position:absolute;top:0;left:0;height:100%;}
.av-platform{position:absolute;background:#7a5230;border-top:4px solid #3f9142;border-radius:3px;}
.av-player{position:absolute;font-size:26px;line-height:1;z-index:6;}
.av-player.grown{font-size:36px;}
.av-player.invincible{animation:av-sparkle .3s infinite alternate;}
@keyframes av-sparkle{ from{filter:drop-shadow(0 0 4px gold);} to{filter:drop-shadow(0 0 10px gold) brightness(1.3);} }
.av-coin{position:absolute;font-size:18px;z-index:4;}
.av-enemy{position:absolute;font-size:22px;z-index:5;}
.av-powerup{position:absolute;font-size:20px;z-index:4;}
.av-flag{position:absolute;font-size:28px;z-index:4;}
.av-squash{animation:av-squash .3s;}
@keyframes av-squash{ 0%{transform:scaleY(1);} 40%{transform:scaleY(.2);} 100%{transform:scaleY(1);opacity:0;} }
.av-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;}
.av-dpad{display:flex;gap:8px;}
.av-ctrlbtn{width:52px;height:44px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
.av-ctrlbtn:active{background:var(--navy-deep);}
.av-jumpbtn{width:70px;height:44px;background:var(--gold);color:var(--navy-deep);border:none;border-radius:10px;font-size:13px;font-weight:700;}
.av-jumpbtn:active{background:var(--gold-light);}
.av-hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--mono);font-size:12px;color:var(--navy);flex-wrap:wrap;gap:4px;}
.av-level-badge{background:var(--navy);color:#fff;padding:2px 9px;border-radius:10px;font-size:11px;}
.av-overlay{position:absolute;inset:0;background:rgba(14,27,61,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;gap:8px;z-index:20;}
.av-overlay h2{font-size:15px;margin:0;}
.av-overlay p{font-size:11px;color:rgba(255,255,255,.8);margin:0;max-width:360px;}
.av-overlay.win{background:rgba(184,134,60,.95);}
.av-overlay.levelup{background:rgba(47,194,173,.95);}
.av-qoverlay{position:absolute;inset:0;background:rgba(14,27,61,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;gap:7px;z-index:20;}
.av-qoverlay .qtag{font-family:var(--mono);font-size:9.5px;color:var(--gold-light);text-transform:uppercase;}
.av-qoverlay .qtext{font-size:12.5px;font-weight:600;max-width:360px;}
.av-qoverlay .opts{display:flex;flex-direction:column;gap:5px;width:100%;max-width:360px;}
.av-qoverlay .opt{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 10px;border-radius:8px;font-size:11.5px;cursor:pointer;text-align:left;display:flex;gap:7px;}
.av-qoverlay .opt.locked{cursor:default;}
.av-qoverlay .opt.chosen-correct{background:rgba(47,194,173,.35);border-color:var(--teal);}
.av-qoverlay .opt.chosen-incorrect{background:rgba(239,106,91,.35);border-color:var(--coral);}
.av-qoverlay .opt.reveal-correct{background:rgba(47,194,173,.35);border-color:var(--teal);}

.locked-msg{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 20px;background:#fff;border:1px dashed var(--line);border-radius:8px;}
.empty-state{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 20px;background:#fff;border:1px dashed var(--line);border-radius:8px;}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,18,48,.6);z-index:50;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:10px;max-width:700px;width:100%;padding:20px;}
.modal h3{margin:0 0 12px;color:var(--navy);}
.modal .close{float:right;cursor:pointer;font-size:18px;color:var(--muted);}
.pin-row{display:flex;gap:8px;margin-top:10px;}
.pin-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--mono);letter-spacing:3px;text-align:center;}
</style>

<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <h1>📊 Curso: Contabilidad Nacional</h1>
      <p>Contabilidad · Undécimo año · Gestión pública</p>
    </div>
    <button class="teacherBtn" id="teacherBtnOpen">👩‍🏫 Panel docente</button>
    <button class="teacherBtn" id="focusModeBtn" style="margin-left:6px;">🔒 Modo enfoque</button>
  </div>
</div>

<div class="namebar">
  <label>Tu nombre:</label>
  <input type="text" id="studentName" placeholder="Nombre completo" maxlength="45">
  <span id="nameStatus" style="font-size:11px;color:var(--muted);font-family:var(--mono);"></span>
</div>

<div class="tabs" id="tabs"></div>

<div class="page" id="page"></div>

<div class="modal-bg" id="pinModalBg">
  <div class="modal">
    <span class="close" id="pinModalClose">✕</span>
    <h3>Panel docente</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0;">Ingrese el PIN para ver el progreso del grupo.</p>
    <div class="pin-row">
      <input type="password" id="pinInput" maxlength="6" placeholder="PIN">
      <button class="btn" id="pinSubmit">Entrar</button>
    </div>
    <div id="pinError" style="color:var(--coral);font-size:11.5px;margin-top:6px;display:none;">PIN incorrecto.</div>
  </div>
</div>

<div class="modal-bg" id="teacherModalBg">
  <div class="modal">
    <span class="close" id="teacherModalClose">✕</span>
    <h3>Panel docente — progreso del curso</h3>
    <div id="teacherContent">Cargando...</div>
  </div>
</div>

<script>
const TEACHER_PIN = "9986";

/* ============================================================
   CONFIGURACIÓN DE MÓDULOS
   ============================================================ */
const MODULES = [
  { id:"antologia", label:"📘 Antología", title:"Antología — Contabilidad Nacional", activityType:"antologia" },
  { id:"concepto", label:"🔤 Sopa de letras", title:"Vocabulario de la Contabilidad Nacional",
    content:"La Dirección General de Contabilidad Nacional (DGCN) es el órgano del Ministerio de Hacienda que emite, aplica y fiscaliza los principios y normas contables que deben seguir las instituciones del sector público costarricense.",
    activityType:"wordsearch" },
  { id:"normativa", label:"🗂️ Crucigrama", title:"Marco Normativo",
    content:"La adopción de las Normas Internacionales de Contabilidad para el Sector Público (NICSP) en Costa Rica se ha dado mediante una serie de decretos del Ministerio de Hacienda, cada uno con un propósito específico dentro de ese proceso.",
    activityType:"crossword" },
  { id:"principios", label:"⚖️ Cuestionario", title:"Objetivos y Funciones",
    content:"La Contabilidad Nacional busca unificar y estandarizar el registro contable del sector público bajo normas internacionales, dando transparencia y comparabilidad a las finanzas del Estado — y consolidando la información financiera de todas las instituciones públicas.",
    activityType:"quiz" },
  { id:"vf", label:"✅ Verdadero/Falso", title:"Verdadero o Falso",
    content:"Repasemos con afirmaciones que pueden ser ciertas o falsas — prestá atención a los detalles.",
    activityType:"vf" },
  { id:"tipos", label:"🔗 Asocie", title:"Asocie — Decretos y su Propósito", activityType:"matching" },
  { id:"contnac_juego", label:"🐱 Aventura de Plataformas", title:"Aventura de Plataformas — Repaso", activityType:"juego" },
  { id:"trabajo", label:"📝 Trabajo en clase", title:"Trabajo en clase — ¿Qué norma aplica?", activityType:"trabajo" },
  { id:"casos", label:"💬 Casos y Debate", title:"Casos y Debate (módulo compartido)", activityType:"casos" },
  { id:"miro", label:"🧠 Lluvia de Ideas", title:"Lluvia de Ideas — Tablero Colaborativo", activityType:"miro" },
  { id:"certificado", label:"🏆 Certificado", title:"Certificado", activityType:"certificado" },
];

const ORDER = ["antologia","concepto","normativa","principios","vf","tipos","contnac_juego","trabajo","casos","miro"];

function isStepDone(id){
  if(id==='antologia') return antologiaLeida;
  if(id==='casos') return !!(localProgress['casos'] && localProgress['casos'].score>0);
  if(id==='miro') return !!(localProgress['miro'] && localProgress['miro'].score>0);
  if(id==='contnac_juego') return !!(localProgress['contnac_juego'] && localProgress['contnac_juego'].total>0);
  return !!(localProgress[id] && localProgress[id].total>0);
}

function currentStepIndex(){
  for(let i=0;i<ORDER.length;i++){ if(!isStepDone(ORDER[i])) return i; }
  return ORDER.length;
}

let activeModule = MODULES[0].id;
let studentName = "";
let antologiaLeida = false;

/* ============================================================
   CONEXIÓN A GOOGLE SHEETS (vía Apps Script Web App)
   ============================================================ */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzMGf_Gpf6UWswFPSqEBMdq-93GxGkrURsT4jtO9Jaz8yT5gyMMtp1btlcDZjRCeuAb/exec";

function sheetsReady(){ return SHEET_API_URL && !SHEET_API_URL.startsWith('REEMPLAZAR'); }

let jsonpCounter = 0;
function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const cleanup = ()=>{ delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); };
    window[cbName] = (data)=>{ settled = true; cleanup(); resolve(data); };
    script.onerror = ()=>{ if(!settled){ cleanup(); reject(new Error('Error de red (JSONP)')); } };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(!settled){ cleanup(); reject(new Error('Tiempo de espera agotado')); } }, 10000);
  });
}

async function sheetGet(sheetName){
  const data = await jsonpRequest(SHEET_API_URL + '?sheet=' + encodeURIComponent(sheetName));
  return data.rows || [];
}

async function sheetPost(sheetName, row){
  await fetch(SHEET_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ sheet: sheetName, row })
  });
  return { ok:true };
}

/* ============================================================
   PROGRESO (en memoria + Google Sheets compartido)
   ============================================================ */
const localProgress = {};

async function saveProgress(moduleId, score, total){
  localProgress[moduleId] = {score, total, ts:Date.now()};
  renderTabs();
  if(!studentName || !sheetsReady()) return;
  try{
    const nowIso = new Date().toISOString();
    await sheetPost('Progreso', [nowIso, studentName, moduleId, score, total]);
  }catch(e){ /* falla silenciosa: el progreso local sigue funcionando */ }
}

/* ============================================================
   ANTI-REINTENTO: bloquear actividades ya completadas
   ============================================================ */
function isLocked(moduleId){
  return !!(localProgress[moduleId] && localProgress[moduleId].total > 0);
}

function renderLockedNotice(moduleId, activityLabel){
  const p = localProgress[moduleId];
  const pctVal = p.total>0 ? Math.round((p.score/p.total)*100) : 0;
  const card = document.createElement('div');
  card.className = 'actcard';
  card.innerHTML = `<h3>✅ Actividad completada</h3>
    <p style="font-size:13px;">Ya completaste <strong>${activityLabel}</strong>. Tu resultado fue <strong>${p.score} / ${p.total}</strong> (${pctVal}%).</p>
    <p style="font-size:11px;color:var(--muted);">Esta actividad ya quedó registrada y no se puede repetir.</p>`;
  pageEl.appendChild(card);
}

async function loadExistingProgress(){
  if(!studentName || !sheetsReady()) return;
  try{
    const rows = await sheetGet('Progreso');
    rows.filter(r => r.Estudiante === studentName).forEach(r=>{
      const mod = r.Modulo;
      if(!mod) return;
      localProgress[mod] = { score:Number(r.Score), total:Number(r.Total), ts:new Date(r.Timestamp).getTime() };
    });
    if(localProgress['antologia']) antologiaLeida = true;
    renderTabs();
    renderPage();
  }catch(e){ /* si falla, las actividades siguen interactivas por seguridad */ }
}

/* ============================================================
   TABS (navegación secuencial por etapas)
   ============================================================ */
const tabsEl = document.getElementById('tabs');
function renderTabs(){
  tabsEl.innerHTML = '';
  const curIdx = currentStepIndex();
  MODULES.forEach(m=>{
    const t = document.createElement('div');
    const done = isStepDone(m.id);
    const orderIdx = ORDER.indexOf(m.id);
    let clickable;
    if(m.id==='certificado' || m.id==='antologia') clickable = true;
    else clickable = (orderIdx === curIdx);
    t.className = 'tab' + (m.id===activeModule?' active':'') + (done?' done':'') + (m.id==='certificado'?' cert':'') + (!clickable?' tab-locked':'');
    t.textContent = m.label;
    t.addEventListener('click', ()=>{
      if(!clickable){
        if(orderIdx > curIdx) alert('Primero debés completar la actividad actual antes de avanzar a esta.');
        else alert('Ya completaste esta actividad — solo podés regresar a la Antología, no a etapas anteriores.');
        return;
      }
      activeModule = m.id;
      renderTabs(); renderPage();
    });
    tabsEl.appendChild(t);
  });
}

/* ============================================================
   RENDER PAGE ROUTER
   ============================================================ */
const pageEl = document.getElementById('page');
function renderPage(){
  const m = MODULES.find(x=>x.id===activeModule);
  pageEl.innerHTML = '';
  if(m.content){
    const c = document.createElement('div');
    c.className = 'content-card';
    c.innerHTML = `<h2>${m.title}</h2><p>${m.content}</p>`;
    pageEl.appendChild(c);
  }
  if(m.activityType==='antologia') renderAntologia();
  else if(m.activityType==='wordsearch') renderWordSearch();
  else if(m.activityType==='crossword') renderCrossword();
  else if(m.activityType==='quiz') renderQuiz();
  else if(m.activityType==='vf') renderVF();
  else if(m.activityType==='matching') renderMatching();
  else if(m.activityType==='trabajo') renderTrabajo();
  else if(m.activityType==='casos') renderCasos();
  else if(m.activityType==='miro') renderMiro();
  else if(m.activityType==='juego') renderJuego();
  else if(m.activityType==='certificado') renderCertificado();
  maybeShowContinue();
}

function maybeShowContinue(){
  if(activeModule==='certificado') return;
  if(!isStepDone(activeModule)) return;
  const idx = ORDER.indexOf(activeModule);
  if(idx===-1) return;
  const nextId = (idx+1<ORDER.length) ? ORDER[idx+1] : 'certificado';
  const nextMod = MODULES.find(x=>x.id===nextId);
  const bar = document.createElement('div');
  bar.className = 'read-confirm';
  bar.innerHTML = `<button class="btn" id="continueBtn">➡️ Continuar a: ${nextMod.label}</button>`;
  pageEl.appendChild(bar);
  document.getElementById('continueBtn').addEventListener('click', ()=>{
    activeModule = nextId; renderTabs(); renderPage();
  });
}

function renderWordSearch(){
  if(isLocked('concepto')){
    renderLockedNotice('concepto', 'la sopa de letras');
    return;
  }
  const card = document.createElement('div');
  card.className = 'actcard';
  const total = Object.keys(WS_DATA.words).length;
  const cellPx = WS_DATA.size > 16 ? 15 : 19;
  card.innerHTML = `<h3>Sopa de letras — encontrá los ${total} términos <span class="scorepill" id="wsScorePill">0 / ${total}</span></h3>
    <div class="ws-wrap">
      <div class="ws-grid" id="wsGrid" style="grid-template-columns:repeat(${WS_DATA.size},${cellPx}px);"></div>
      <div class="ws-list"><ul id="wsList"></ul></div>
    </div>`;
  pageEl.appendChild(card);

  const gridEl = document.getElementById('wsGrid');
  const cells = [];
  for(let r=0;r<WS_DATA.size;r++){
    const row=[];
    for(let c=0;c<WS_DATA.size;c++){
      const div = document.createElement('div');
      div.className='ws-cell';
      div.style.width = cellPx+'px';
      div.style.height = cellPx+'px';
      div.style.fontSize = (WS_DATA.size>16 ? '7.5px' : '9.5px');
      div.textContent = WS_DATA.grid[r][c];
      div.dataset.r=r; div.dataset.c=c;
      gridEl.appendChild(div);
      row.push(div);
    }
    cells.push(row);
  }
  const wordKeys = Object.keys(WS_DATA.words);
  const wordCellSet = {};
  wordKeys.forEach(w=>{ wordCellSet[w] = new Set(WS_DATA.words[w].map(([r,c])=>r+','+c)); });
  const listEl = document.getElementById('wsList');
  const liByWord = {};
  wordKeys.slice().sort().forEach(w=>{
    const li = document.createElement('li');
    li.textContent = w;
    listEl.appendChild(li);
    liByWord[w]=li;
  });

  let found=0;
  let selecting=false, path=[];
  function keyOf(r,c){return r+','+c;}
  function clearSel(){ path.forEach(([r,c])=>{ if(!cells[r][c].classList.contains('found')) cells[r][c].classList.remove('selected'); }); }
  function tryMatch(){
    const selSet = new Set(path.map(([r,c])=>keyOf(r,c)));
    for(const w of wordKeys){
      if(liByWord[w].classList.contains('found')) continue;
      const wSet = wordCellSet[w];
      if(wSet.size!==selSet.size) continue;
      let match=true;
      for(const k of wSet){ if(!selSet.has(k)){match=false;break;} }
      if(match){
        WS_DATA.words[w].forEach(([r,c])=>{ cells[r][c].classList.add('found'); cells[r][c].classList.remove('selected'); });
        liByWord[w].classList.add('found');
        found++;
        document.getElementById('wsScorePill').textContent = found+' / '+total;
        if(found===total){ saveProgress('concepto', found, total); maybeShowContinue(); }
        return true;
      }
    }
    return false;
  }
  function startSel(r,c){ selecting=true; path=[[r,c]]; cells[r][c].classList.add('selected'); }
  function moveSel(r,c){
    if(!selecting) return;
    const [r0,c0]=path[0];
    const dr=r-r0, dc=c-c0;
    if(dr!==0 && dc!==0 && Math.abs(dr)!==Math.abs(dc)) return;
    const steps=Math.max(Math.abs(dr),Math.abs(dc));
    const sdr=steps===0?0:Math.sign(dr), sdc=steps===0?0:Math.sign(dc);
    clearSel(); path=[];
    for(let i=0;i<=steps;i++){
      const rr=r0+sdr*i, cc=c0+sdc*i;
      if(rr<0||rr>=WS_DATA.size||cc<0||cc>=WS_DATA.size) break;
      path.push([rr,cc]);
      cells[rr][cc].classList.add('selected');
    }
  }
  function endSel(){ if(!selecting) return; selecting=false; if(!tryMatch()) clearSel(); path=[]; }
  gridEl.addEventListener('mousedown', e=>{ const t=e.target.closest('.ws-cell'); if(t) startSel(+t.dataset.r,+t.dataset.c); });
  gridEl.addEventListener('mouseover', e=>{ const t=e.target.closest('.ws-cell'); if(t) moveSel(+t.dataset.r,+t.dataset.c); });
  document.addEventListener('mouseup', endSel);
  gridEl.addEventListener('touchstart', e=>{ const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY); const c=t&&t.closest('.ws-cell'); if(c) startSel(+c.dataset.r,+c.dataset.c); }, {passive:true});
  gridEl.addEventListener('touchmove', e=>{ const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY); const c=t&&t.closest('.ws-cell'); if(c) moveSel(+c.dataset.r,+c.dataset.c); }, {passive:true});
  document.addEventListener('touchend', endSel);
}

const MATCH_DATA = {
  terms:["Decreto 34460-H","Decreto 34918-H","Decreto 35535-H","Decreto 35616-H","Decreto 41039-H"],
  defs:[
    "Adopta las NIIF para las empresas públicas",
    "Establece los principios de contabilidad para el sector público",
    "Reglamenta la organización de la Dirección General de Contabilidad Nacional",
    "Establece el cierre de brechas entre la normativa nacional y las NICSP",
    "Adopta e implementa formalmente las NICSP en Costa Rica"
  ],
  correct:[1,4,2,0,3]
};

function renderMatching(){
  if(isLocked('tipos')){
    renderLockedNotice('tipos', 'el asocie');
    return;
  }
  const card = document.createElement('div');
  card.className = 'actcard';
  const letters=['A','B','C','D','E'];
  let rows='';
  MATCH_DATA.terms.forEach((t,i)=>{
    rows += `<tr class="match-row" data-i="${i}"><td>${i+1}. ${t}</td><td><select data-i="${i}"><option value="">— Seleccione —</option>${MATCH_DATA.defs.map((d,j)=>`<option value="${j}">${letters[j]}</option>`).join('')}</select></td></tr>`;
  });
  card.innerHTML = `<h3>Asocie — relacione ambas columnas <span class="scorepill" id="mtScorePill">0 / 5</span></h3>
    <table class="match-table"><tbody>${rows}</tbody></table>
    <div class="bank"><b>Columna B</b><br>${MATCH_DATA.defs.map((d,j)=>`${letters[j]}. ${d}`).join('<br>')}</div>
    <button class="btn" id="mtCheckBtn" style="margin-top:10px;">Comprobar</button>`;
  pageEl.appendChild(card);

  document.getElementById('mtCheckBtn').addEventListener('click', function(){
    if(this.disabled) return;
    const selects = document.querySelectorAll('.match-table select');
    let correct=0, allAnswered=true;
    selects.forEach(sel=>{
      const i = parseInt(sel.dataset.i,10);
      if(sel.value===""){ allAnswered=false; return; }
      const row = sel.closest('.match-row');
      if(parseInt(sel.value,10)===MATCH_DATA.correct[i]){ row.classList.add('ok'); correct++; }
      else row.classList.add('bad');
    });
    if(!allAnswered){ alert('Completá las 5 relaciones antes de comprobar.'); return; }
    selects.forEach(s=>s.disabled=true);
    this.disabled=true;
    document.getElementById('mtScorePill').textContent = correct+' / 5';
    saveProgress('tipos', correct, 5);
    maybeShowContinue();
  });
}

async function loadDebateMessages(temaId){
  const wrap = document.getElementById('msgs-'+temaId);
  if(!wrap) return;
  if(!sheetsReady()){
    wrap.innerHTML = '<div style="font-size:11px;color:var(--coral);">Hoja de datos no configurada todavía.</div>';
    return;
  }
  try{
    const rows = await sheetGet('Casos');
    const items = rows
      .filter(r => r.CasoId === temaId)
      .map(r => ({ name: r.Nombre, text: r.Texto, ts: new Date(r.Timestamp).getTime() }));
    if(items.length===0){ wrap.innerHTML = '<div style="font-size:11px;color:var(--muted);">Nadie ha respondido todavía.</div>'; return; }
    items.sort((a,b)=>a.ts-b.ts);
    wrap.innerHTML = items.map(m=>`<div class="caso-msg" style="background:#f7f8f6;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;"><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:3px;"><span style="font-weight:700;color:var(--navy);">${escapeHtml(m.name)}</span><span>${new Date(m.ts).toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'})}</span></div>${escapeHtml(m.text)}</div>`).join('');
  }catch(e){
    wrap.innerHTML = '<div style="font-size:11px;color:var(--coral);">No se pudo cargar (revisá la conexión a la hoja de datos).</div>';
  }
}

async function checkDebateParticipation(){
  if(!studentName || !sheetsReady()) return;
  let ownCount = 0;
  try{
    const rows = await sheetGet('Casos');
    DEBATE_TEMAS.forEach(t=>{
      ownCount += rows.filter(r => r.CasoId === t.id && r.Nombre === studentName).length;
    });
  }catch(e){}
  if(ownCount >= 2 && !isStepDone('casos')){
    saveProgress('casos', 1, 1);
    renderPage();
  }
}

  { q:"¿Por qué es importante consultar las directrices del año en curso?", opts:["Porque la normativa se actualiza y debe aplicarse la versión vigente","Porque los decretos originales ya no tienen validez legal","Porque las directrices reemplazan por completo a los decretos"], correct:0,

  { q:"¿Qué logra la Contabilidad Nacional al consolidar la información financiera de varias instituciones?", opts:["Elimina la necesidad de que cada institución lleve su propia contabilidad","Permite comparar y sumar las finanzas bajo un mismo lenguaje contable","Aumenta automáticamente el presupuesto de cada institución"], correct:1,

function renderJuego(){
  if(isLocked('contnac_juego')){
    renderLockedNotice('contnac_juego', 'la Aventura de Plataformas');
    return;
  }
  const card = document.createElement('div');
  card.className = 'actcard';
  card.innerHTML = `
    <h3>🐱 Aventura de Plataformas — 5 niveles</h3>
    <div class="av-hud">
      <span class="av-level-badge" id="avHudLevel">Nivel 1 / 5</span>
      <span id="avHudLives">❤️❤️❤️</span>
      <span id="avHudCoins">🪙 0</span>
    </div>
    <div class="gamebox" id="avGameBox">
      <div class="av-overlay" id="avStartOverlay">
        <h2>🐱 Aventura de Plataformas</h2>
        <p>Usá las flechas para caminar y el botón de salto. Recolectá todas las monedas de cada nivel y llegá a la bandera 🚩. El hongo 🍄 te hace crecer, la estrella ⭐ te vuelve invencible. Si un fantasma te toca perdés una vida — respondé bien para recuperarla. ¡Saltale encima para eliminarlo!</p>
        <button class="btn" id="avStartBtn">▶️ Comenzar</button>
      </div>
    </div>
    <div class="av-controls">

      </div>
      <button class="av-jumpbtn" id="avJumpBtn">⬆️ SALTAR</button>
    </div>
  `;
  pageEl.appendChild(card);
  initAventuraGame();
}

function initAventuraGame(){
  const gameBox = document.getElementById('avGameBox');
  const worldEl = document.createElement('div');
  worldEl.className = 'av-world';
  gameBox.appendChild(worldEl);
  const hudLives = document.getElementById('avHudLives');
  const hudCoins = document.getElementById('avHudCoins');
  const hudLevel = document.getElementById('avHudLevel');

  let currentLevelIdx = 0;
  let px, py, pvx, pvy, grounded, grown, invincible, invincibleUntil;
  let lives, coinsCollected, coinsState, mushroomState, starState;
  let enemies, enemyAlive, cameraX;
  let running = false, paused = false, rafId;
  let leftHeld=false, rightHeld=false;
  let usedQ = [];

  function currentLevel(){ return AV_LEVELS[currentLevelIdx]; }

  function resetPlayerToStart(){
    px = 30; py = 240-AV_PLAYER_SIZE; pvx=0; pvy=0; grounded=true;
    cameraX = 0;
  }

  function loadLevel(idx){
    currentLevelIdx = idx;
    const lvl = currentLevel();
    resetPlayerToStart();
    coinsCollected = 0;
    coinsState = lvl.coins.map(()=>true);
    mushroomState = lvl.mushrooms.map(()=>true);
    starState = lvl.stars.map(()=>true);
    enemies = lvl.enemies.map(e=>({...e}));
    enemyAlive = lvl.enemies.map(()=>true);
    grown = false; invincible = false; invincibleUntil = 0;
    updateHUD();
    buildScene();
    syncVisuals();
  }

  function updateHUD(){
    const lvl = currentLevel();
    hudLevel.textContent = 'Nivel ' + lvl.levelNum + ' / ' + AV_LEVELS.length;
    hudLives.textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(3-lives,0));
    hudCoins.textContent = '🪙 ' + coinsCollected + ' / ' + lvl.coins.length;
  }

  let playerEl, coinEls=[], enemyEls=[], mushroomEls=[], starEls=[], flagEl;

  function buildScene(){
    worldEl.innerHTML = '';
    const lvl = currentLevel();
    worldEl.style.width = lvl.width + 'px';

    lvl.platforms.forEach(p=>{
      const el = document.createElement('div');
      el.className='av-platform';
      el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.width=p.w+'px'; el.style.height=p.h+'px';
      worldEl.appendChild(el);
    });

    playerEl = document.createElement('div');
    playerEl.className='av-player';
    playerEl.textContent='🐱';
    worldEl.appendChild(playerEl);

    coinEls = lvl.coins.map(c=>{
      const el = document.createElement('div');
      el.className='av-coin'; el.textContent='🪙';
      el.style.left=c.x+'px'; el.style.top=c.y+'px';
      worldEl.appendChild(el);
      return el;
    });

    mushroomEls = lvl.mushrooms.map(m=>{
      const el = document.createElement('div');
      el.className='av-powerup'; el.textContent='🍄';
      el.style.left=m.x+'px'; el.style.top=m.y+'px';
      worldEl.appendChild(el);
      return el;
    });

    starEls = lvl.stars.map(s=>{
      const el = document.createElement('div');
      el.className='av-powerup'; el.textContent='⭐';
      el.style.left=s.x+'px'; el.style.top=s.y+'px';
      worldEl.appendChild(el);
      return el;
    });

    flagEl = document.createElement('div');
    flagEl.className='av-flag'; flagEl.textContent='🚩';
    flagEl.style.left=lvl.flag.x+'px'; flagEl.style.top=lvl.flag.y+'px';
    worldEl.appendChild(flagEl);

    enemyEls = enemies.map(()=>{
      const el = document.createElement('div');
      el.className='av-enemy'; el.textContent='👻';
      worldEl.appendChild(el);
      return el;
    });
  }

  function syncVisuals(){
    const lvl = currentLevel();
    cameraX = px - AV_GW/2 + AV_PLAYER_SIZE/2;
    cameraX = Math.max(0, Math.min(lvl.width - AV_GW, cameraX));
    worldEl.style.transform = 'translateX(' + (-cameraX) + 'px)';

    playerEl.style.left = px+'px';
    playerEl.style.top = py+'px';
    playerEl.classList.toggle('grown', grown);
    playerEl.classList.toggle('invincible', invincible);
    playerEl.style.transform = (pvx < 0 ? 'scaleX(-1)' : 'scaleX(1)');

    coinEls.forEach((el,i)=>{ el.style.display = coinsState[i] ? 'block' : 'none'; });
    mushroomEls.forEach((el,i)=>{ el.style.display = mushroomState[i] ? 'block' : 'none'; });
    starEls.forEach((el,i)=>{ el.style.display = starState[i] ? 'block' : 'none'; });

    enemies.forEach((e,i)=>{
      if(!enemyAlive[i]) return;
      enemyEls[i].style.left = e.x + 'px';
      enemyEls[i].style.top = (lvl.platforms[e.platformIdx].y - 22) + 'px';
    });
  }

  function rectsOverlap(a,b){
    return !(a.x+a.w < b.x || a.x > b.x+b.w || a.y+a.h < b.y || a.y > b.y+b.h);
  }
  function playerRect(){
    const size = grown ? AV_PLAYER_SIZE*1.3 : AV_PLAYER_SIZE;
    return {x:px, y:py, w:size, h:size};
  }

  function physicsStep(){
    const lvl = currentLevel();
    pvx = 0;
    if(leftHeld) pvx = -AV_MOVE_SPEED;
    if(rightHeld) pvx = AV_MOVE_SPEED;
    px += pvx;
    px = Math.max(0, Math.min(lvl.width-AV_PLAYER_SIZE, px));

    pvy += AV_GRAVITY;
    const prevY = py;
    const nextY = py + pvy;

    grounded = false;
    for(const plat of lvl.platforms){
      const withinX = px + AV_PLAYER_SIZE > plat.x && px < plat.x + plat.w;
      const wasAbove = (prevY + AV_PLAYER_SIZE) <= plat.y + 2;
      const willBeBelowOrAt = (nextY + AV_PLAYER_SIZE) >= plat.y;
      if(withinX && wasAbove && willBeBelowOrAt && pvy >= 0){
        py = plat.y - AV_PLAYER_SIZE;
        pvy = 0;
        grounded = true;
        break;
      }
    }
    if(!grounded){ py = nextY; }

    if(py > AV_GH){ loseLife(); return; }
    if(invincible && Date.now() > invincibleUntil){ invincible = false; }

    moveEnemies();
    checkCollisions(prevY);
    syncVisuals();
  }

  function moveEnemies(){
    enemies.forEach((e,i)=>{
      if(!enemyAlive[i]) return;
      e.x += e.dir * e.speed;
      if(e.x < e.minX || e.x > e.maxX) e.dir *= -1;
    });
  }

  function checkCollisions(prevY){
    const lvl = currentLevel();
    const pRect = playerRect();

    coinsState.forEach((present,i)=>{
      if(!present) return;
      const c = lvl.coins[i];
      if(rectsOverlap(pRect, {x:c.x,y:c.y,w:16,h:16})){
        coinsState[i] = false;
        coinsCollected++;
        updateHUD();
      }
    });
    mushroomState.forEach((present,i)=>{
      if(!present) return;
      const m = lvl.mushrooms[i];
      if(rectsOverlap(pRect, {x:m.x,y:m.y,w:18,h:18})){
        mushroomState[i] = false;
        grown = true;
      }
    });
    starState.forEach((present,i)=>{
      if(!present) return;
      const s = lvl.stars[i];
      if(rectsOverlap(pRect, {x:s.x,y:s.y,w:18,h:18})){
        starState[i] = false;
        invincible = true;
        invincibleUntil = Date.now() + 5000;
      }
    });
    enemies.forEach((e,i)=>{
      if(!enemyAlive[i]) return;
      const eRect = {x:e.x, y:lvl.platforms[e.platformIdx].y-22, w:20, h:20};
      if(!rectsOverlap(pRect, eRect)) return;
      const fallingOntoTop = pvy > 0 && (prevY + AV_PLAYER_SIZE) <= eRect.y + 8;
      if(fallingOntoTop){ stompEnemy(i); }
      else if(invincible){ stompEnemy(i); }
      else if(grown){ grown = false; px += (px < e.x) ? -14 : 14; }
      else{ loseLife(); }
    });
    if(rectsOverlap(pRect, {x:lvl.flag.x,y:lvl.flag.y,w:20,h:26})){
      if(coinsCollected >= lvl.coins.length){ onLevelComplete(); }
    }
  }

  function stompEnemy(i){
    enemyAlive[i] = false;
    enemyEls[i].classList.add('av-squash');
    setTimeout(()=>{ enemyEls[i].style.display='none'; }, 300);
    pvy = AV_STOMP_BOUNCE;
    avTotalStomps++;
  }

  function loseLife(){
    if(paused) return;
    paused = true;
    lives--;
    updateHUD();
    if(lives <= 0){ showGameOver(); return; }
    showQuestion();
  }

  function pickQuestion(){
    const avail = AV_QUESTION_BANK.filter((_,i)=>!usedQ.includes(i));
    const pool = avail.length?avail:AV_QUESTION_BANK;
    const idx = AV_QUESTION_BANK.indexOf(pool[Math.floor(Math.random()*pool.length)]);
    usedQ.push(idx);
    if(usedQ.length>=AV_QUESTION_BANK.length) usedQ=[];
    return AV_QUESTION_BANK[idx];
  }

  function showQuestion(){
    const item = pickQuestion();
    const overlay = document.createElement('div');
    overlay.className='av-qoverlay';
    const letters=['A','B','C'];
    overlay.innerHTML = `<span class="qtag">💔 Perdiste una vida — respondé bien para recuperarla</span>
      <div class="qtext">${item.q}</div><div class="opts"></div>`;
    gameBox.appendChild(overlay);
    const optsDiv = overlay.querySelector('.opts');
    item.opts.forEach((optText,oi)=>{
      const opt=document.createElement('div');
      opt.className='opt';
      opt.innerHTML=`<span class="letter">${letters[oi]}</span><span>${optText}</span>`;
      opt.addEventListener('click', ()=>{
        if(overlay.dataset.answered) return;
        overlay.dataset.answered='1';
        optsDiv.querySelectorAll('.opt').forEach(o=>o.classList.add('locked'));
        const isCorrect = oi===item.correct;
        opt.classList.add(isCorrect?'chosen-correct':'chosen-incorrect');
        if(!isCorrect) optsDiv.querySelectorAll('.opt')[item.correct].classList.add('reveal-correct');
        avTotalAnswered++; if(isCorrect) avTotalCorrect++;
        setTimeout(()=>{
          overlay.remove();
          if(isCorrect){ lives++; updateHUD(); }
          paused=false;
          resetPlayerToStart();
          rafId = requestAnimationFrame(loop);
        }, 1300);
      });
      optsDiv.appendChild(opt);
    });
  }

  function guardarLogroJuego(){
    avBestLevel = Math.max(avBestLevel, currentLevel().levelNum);
    if(avTotalAnswered > 0){
      saveProgress('contnac_juego', avTotalCorrect, avTotalAnswered);
    } else {
      saveProgress('contnac_juego', 1, 1);
    }
    if(sheetsReady() && studentName){
      const nowIso = new Date().toISOString();
      sheetPost('Progreso', [nowIso, studentName, 'contnac_juego_nivel', avBestLevel, AV_LEVELS.length]).catch(()=>{});
      sheetPost('Progreso', [nowIso, studentName, 'contnac_juego_stomps', avTotalStomps, avTotalStomps]).catch(()=>{});
    }
  }

  function showGameOver(){
    running=false; paused=false;
    const overlay = document.createElement('div');
    overlay.className='av-overlay';
    overlay.innerHTML = `<h2>💥 Sin vidas</h2>
      <p>Llegaste al nivel ${currentLevel().levelNum} de ${AV_LEVELS.length} · Fantasmas eliminados: ${avTotalStomps} · Preguntas: ${avTotalAnswered} (${avTotalCorrect} correctas)</p>
      <button class="btn" id="avRetryBtn">🔄 Reintentar desde el nivel 1</button>`;
    gameBox.appendChild(overlay);
    guardarLogroJuego();
    maybeShowContinue();
    document.getElementById('avRetryBtn').addEventListener('click', ()=>{
      overlay.remove(); startGame();
    });
  }

  function onLevelComplete(){
    running=false; paused=true;
    if(rafId) cancelAnimationFrame(rafId);
    const isLastLevel = currentLevelIdx >= AV_LEVELS.length-1;
    const overlay = document.createElement('div');
    if(isLastLevel){
      overlay.className = 'av-overlay win';
      overlay.innerHTML = `<h2>🏆 ¡Completaste los ${AV_LEVELS.length} niveles!</h2>
        <p>Fantasmas eliminados: ${avTotalStomps} · Preguntas: ${avTotalAnswered} (${avTotalCorrect} correctas)</p>
        <button class="btn" id="avPlayAgainBtn">🔄 Jugar de nuevo</button>`;
    } else {
      overlay.className = 'av-overlay levelup';
      overlay.innerHTML = `<h2>✅ ¡Nivel ${currentLevel().levelNum} completo!</h2>
        <p>Preparate para el nivel ${currentLevel().levelNum+1}.</p>
        <button class="btn" id="avNextLevelBtn">➡️ Siguiente nivel</button>`;
    }
    gameBox.appendChild(overlay);
    guardarLogroJuego();
    if(isLastLevel) maybeShowContinue();

    if(isLastLevel){
      document.getElementById('avPlayAgainBtn').addEventListener('click', ()=>{
        overlay.remove(); startGame();
      });
    } else {
      document.getElementById('avNextLevelBtn').addEventListener('click', ()=>{
        overlay.remove();
        loadLevel(currentLevelIdx+1);
        running=true; paused=false;
        rafId = requestAnimationFrame(loop);
      });
    }
  }

  function loop(){
    if(!running || paused) return;
    physicsStep();
    rafId = requestAnimationFrame(loop);
  }

  function startGame(){
    lives = 3;
    avTotalAnswered = 0; avTotalCorrect = 0; avTotalStomps = 0; usedQ = [];
    loadLevel(0);
    running = true; paused = false;
    rafId = requestAnimationFrame(loop);
  }

  document.getElementById('avStartBtn').addEventListener('click', ()=>{
    document.getElementById('avStartOverlay').remove();
    startGame();
  });

  function bindHold(el, onDown, onUp){
    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
    el.addEventListener('mouseleave', onUp);
    el.addEventListener('touchstart', e=>{ e.preventDefault(); onDown(); }, {passive:false});
    el.addEventListener('touchend', e=>{ e.preventDefault(); onUp(); }, {passive:false});
  }
  bindHold(document.getElementById('avLeftBtn'), ()=>leftHeld=true, ()=>leftHeld=false);
  bindHold(document.getElementById('avRightBtn'), ()=>rightHeld=true, ()=>rightHeld=false);
  document.getElementById('avJumpBtn').addEventListener('click', ()=>{
    if(grounded && running && !paused){ pvy = AV_JUMP_VELOCITY; grounded=false; }
  });
  const avKeyHandler = e=>{
    if(!running||paused) return;
    if(e.code==='ArrowLeft') leftHeld=true;
    if(e.code==='ArrowRight') rightHeld=true;
    if(e.code==='Space'||e.code==='ArrowUp'){ if(grounded){ pvy=AV_JUMP_VELOCITY; grounded=false; } }
  };
  const avKeyUpHandler = e=>{
    if(e.code==='ArrowLeft') leftHeld=false;
    if(e.code==='ArrowRight') rightHeld=false;
  };
  document.addEventListener('keydown', avKeyHandler);
  document.addEventListener('keyup', avKeyUpHandler);
}

function competencyScore(mods){
  let sum=0, total=0, anyData=false;
  mods.forEach(mid=>{
    const p = localProgress[mid];
    if(p){ sum+=p.score; total+=p.total; anyData=true; }
  });
  return { sum, total, pct: anyData && total>0 ? Math.round((sum/total)*100) : null };
}

function competencyLevel(pctVal){
  if(pctVal===null) return { label:"Sin evidencia", cls:"status-pending", n:0 };
  if(pctVal<=50) return { label:"No logrado", cls:"status-bad", n:1 };
  if(pctVal<=80) return { label:"En proceso", cls:"status-mid", n:2 };
  return { label:"Logrado", cls:"status-ok", n:3 };
}

async function checkPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(val !== TEACHER_PIN){
    document.getElementById('pinError').style.display = 'block';
    return;
  }
  document.getElementById('pinModalBg').classList.remove('show');

async function openTeacherPanel(){
  document.getElementById('teacherModalBg').classList.add('show');
  const content = document.getElementById('teacherContent');
  content.innerHTML = 'Cargando...';
  if(!sheetsReady()){
    content.innerHTML = '<p style="font-size:12.5px;color:var(--coral);">⚠️ Falta configurar la conexión a la hoja de datos (SHEET_API_URL) en este archivo.</p>';
    return;
  }
  try{
    const progRows = await sheetGet('Progreso');
    const byStudent = {};
    progRows.forEach(r=>{
      const name = r.Estudiante, mod = r.Modulo;
      if(!name || !mod) return;
      byStudent[name] = byStudent[name] || {};
      byStudent[name][mod] = { score:Number(r.Score), total:Number(r.Total) };
    });
    const names = Object.keys(byStudent).sort();

    content.innerHTML = `
      <div class="empresa-tabs" style="margin-bottom:12px;">
        <div class="empresa-tab active" id="tpViewGeneral" style="cursor:pointer;">📊 Progreso general</div>
        <div class="empresa-tab" id="tpViewJuego" style="cursor:pointer;">🐱 Aventura de Plataformas</div>
      </div>
      <div id="tpContentArea"></div>
    `;
    document.getElementById('tpViewGeneral').addEventListener('click', ()=>{
      document.getElementById('tpViewGeneral').classList.add('active');
      document.getElementById('tpViewJuego').classList.remove('active');
      renderPanelGeneral(names, byStudent);
    });
    document.getElementById('tpViewJuego').addEventListener('click', ()=>{
      document.getElementById('tpViewJuego').classList.add('active');
      document.getElementById('tpViewGeneral').classList.remove('active');
      renderPanelJuego(names, byStudent);
    });

    if(names.length===0){
      document.getElementById('tpContentArea').innerHTML = '<p style="font-size:12.5px;color:var(--muted);">Todavía no hay estudiantes con progreso guardado.</p>';
      return;
    }
    renderPanelGeneral(names, byStudent);
  }catch(e){
    content.innerHTML = '<p style="font-size:12.5px;color:var(--coral);">No se pudo cargar el panel (revisá la conexión a la hoja de datos).</p>';
  }
}

function renderPanelGeneral(names, byStudent){
  const area = document.getElementById('tpContentArea');
  const levelAbbrev = (pctVal)=>{
    if(pctVal===null) return '—';
    const lvl = competencyLevel(pctVal);
    const short = {"Logrado":"✓ 3","En proceso":"◐ 2","No logrado":"✕ 1"}[lvl.label] || lvl.label;
    return `<span class="${lvl.cls}">${short}</span>`;
  };
  let html = '<p style="font-size:10.5px;color:var(--muted);margin-top:0;">Nivel por indicador: 1 No logrado · 2 En proceso · 3 Logrado. El detalle de la Aventura de Plataformas está en su propia pestaña.</p>';
  html += '<table class="progress-table"><tr><th>Estudiante</th><th>Antología</th><th>RA1</th><th>RA2</th><th>RA3 Trabajo</th><th>Casos</th><th>Miro</th><th>Salidas</th></tr>';
  names.forEach(n=>{
    const d = byStudent[n];
    const compPct = (mods)=>{
      let sum=0,total=0,any=false;
      mods.forEach(mid=>{ const x=d[mid]; if(x){ sum+=x.score; total+=x.total; any=true; } });
      return any && total>0 ? Math.round((sum/total)*100) : null;
    };
    const okCell = (obj)=> obj ? (obj.score>0 ? '<span class="status-ok">✓ Logrado</span>' : '<span class="status-pending">Sin evidencia</span>') : '—';
    const salidas = d.incidente_salida_pantalla ? d.incidente_salida_pantalla.score : 0;
    const salidasCell = salidas > 0 ? `<span class="status-bad">⚠️ ${salidas}</span>` : '<span class="status-pending">0</span>';
    html += `<tr>
      <td>${escapeHtml(n)}</td>
      <td class="center">${okCell(d.antologia)}</td>
      <td class="center">${levelAbbrev(compPct(['concepto']))}</td>
      <td class="center">${levelAbbrev(compPct(['normativa','principios','vf','tipos']))}</td>
      <td class="center">${levelAbbrev(compPct(['trabajo']))}</td>
      <td class="center">${okCell(d.casos)}</td>
      <td class="center">${okCell(d.miro)}</td>
      <td class="center">${salidasCell}</td>
    </tr>`;
  });
  html += '</table>';
  area.innerHTML = html;
}

function renderPanelJuego(names, byStudent){
  const area = document.getElementById('tpContentArea');
  const jugadores = names.filter(n => byStudent[n]['contnac_juego_nivel'] || byStudent[n]['contnac_juego']);
  if(jugadores.length===0){
    area.innerHTML = '<div class="empty-state">Todavía nadie ha jugado la Aventura de Plataformas.</div>';
    return;
  }
  let html = '<p style="font-size:10.5px;color:var(--muted);margin-top:0;">Evaluación independiente de esta actividad — no se mezcla con el resto del progreso del curso.</p>';
  html += '<table class="progress-table"><tr><th>Estudiante</th><th>Preguntas</th><th>Nivel alcanzado</th><th>Fantasmas eliminados</th></tr>';
  jugadores.forEach(n=>{
    const d = byStudent[n];
    const preg = d['contnac_juego'];
    const pregCell = preg ? `${preg.score} / ${preg.total} correctas` : '—';
    const nivel = d['contnac_juego_nivel'];
    const nivelCell = nivel ? `${nivel.score} / ${nivel.total}${nivel.score>=nivel.total?' 🏆':''}` : '—';
    const stomps = d['contnac_juego_stomps'];
    const stompsCell = stomps ? stomps.score : 0;
    html += `<tr>
      <td>${escapeHtml(n)}</td>
      <td class="center">${pregCell}</td>
      <td class="center">${nivelCell}</td>
      <td class="center">${stompsCell}</td>
    </tr>`;
  });
  html += '</table>';
  area.innerHTML = html;
}

document.getElementById('teacherModalClose').addEventListener('click', ()=>{
  document.getElementById('teacherModalBg').classList.remove('show');
});

/* ============================================================
   NOMBRE DEL ESTUDIANTE
   ============================================================ */
document.getElementById('studentName').addEventListener('input', function(){
  studentName = this.value.trim();
  document.getElementById('nameStatus').textContent = studentName ? '● identificado' : '';
});
document.getElementById('studentName').addEventListener('change', function(){
  if(studentName) loadExistingProgress();
});

/* ============================================================
   PRELLENADO DESDE UN ENLACE (?nombre=...)
   ============================================================ */
(function prefillFromLink(){
  const params = new URLSearchParams(window.location.search);
  const nombreParam = params.get('nombre');
  if(nombreParam){
    studentName = nombreParam;
    document.getElementById('studentName').value = nombreParam;
    document.getElementById('nameStatus').textContent = '● identificado';
    loadExistingProgress();
  }
})();

/* ============================================================
   MODO ENFOQUE: pantalla completa + detección de salidas
   ============================================================ */
let salidaCount = 0;
document.getElementById('focusModeBtn').addEventListener('click', ()=>{
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req) req.call(el).catch(()=>{});
});

function showWarnBanner(msg){
  let banner = document.getElementById('warnBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'warnBanner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:200;background:#EF6A5B;color:#fff;text-align:center;padding:8px 12px;font-size:12.5px;font-family:monospace;';
    document.body.prepend(banner);
  }
  banner.textContent = msg;
  banner.style.display = 'block';
  clearTimeout(window._warnTimeout);
  window._warnTimeout = setTimeout(()=>{ banner.style.display='none'; }, 6000);
}

function logSalida(){
  salidaCount++;
  showWarnBanner('⚠️ Se detectó que saliste de esta pestaña o ventana (van: ' + salidaCount + ').');
  if(studentName && sheetsReady()){
    sheetPost('Progreso', [new Date().toISOString(), studentName, 'incidente_salida_pantalla', salidaCount, salidaCount]).catch(()=>{});
  }
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) logSalida(); });

window.addEventListener('beforeunload', function(e){
  e.preventDefault();
  e.returnValue = '';
});

document.addEventListener('contextmenu', e=> e.preventDefault());
document.addEventListener('copy', e=> e.preventDefault());

/* ============================================================
   INICIO
   ============================================================ */
renderTabs();
renderPage();
</script>
</body>
</html>
