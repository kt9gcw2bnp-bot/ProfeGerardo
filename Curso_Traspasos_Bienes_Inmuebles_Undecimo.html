<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios de Impuestos sobre los Traspasos de Bienes Inmuebles</title>
<style>
:root{
  --azul:#1d4ed8; --azul-osc:#1e3a8a; --verde:#16a34a; --rojo:#dc2626; --gris:#64748b; --fondo:#f8fafc;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--fondo);margin:0;color:#0f172a;}
#app{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
h1{color:var(--azul-osc);font-size:1.8rem;margin-bottom:4px;}
h2{color:var(--azul-osc);border-bottom:3px solid var(--azul);padding-bottom:6px;}
.subtitulo{color:var(--gris);margin-top:0;}
.portada{max-width:640px;margin:60px auto;text-align:center;}
.portada-caja{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:28px;margin-top:20px;}
.portada-caja input{width:100%;padding:10px;font-size:1rem;border:1px solid #cbd5e1;border-radius:8px;margin:10px 0 16px;}
.btn-primario{background:var(--azul);color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;}
.btn-primario:hover{background:var(--azul-osc);}
.btn-primario:disabled{opacity:.6;cursor:default;}
.btn-secundario{background:#e2e8f0;color:#0f172a;border:none;padding:10px 18px;border-radius:8px;font-size:.95rem;cursor:pointer;margin:4px 6px 4px 0;}
.btn-secundario:hover{background:#cbd5e1;}
.btn-link{background:none;border:none;color:var(--gris);text-decoration:underline;cursor:pointer;margin-top:18px;}
.aviso{font-size:.85rem;color:var(--gris);margin-top:14px;}
.progbar-wrap{max-width:900px;margin:0 auto;padding:10px 20px 0;}
.progbar-track{background:#e2e8f0;border-radius:6px;height:10px;overflow:hidden;}
.progbar-fill{background:var(--verde);height:100%;transition:width .3s;}
.progbar-text{font-size:.8rem;color:var(--gris);margin:4px 0 0;}
.paso-wrap{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:26px;margin-top:16px;}
.antologia-texto{line-height:1.65;}
.antologia-texto h3{color:var(--azul);}
.pregunta-mc{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eef2f7;}
.opcion{display:block;padding:6px 0;cursor:pointer;}
.resultado{font-weight:600;margin-top:10px;}
.nav-footer{display:flex;justify-content:space-between;margin-top:22px;}
.asocie-col{display:inline-block;vertical-align:top;width:47%;margin-right:2%;}
.asocie-input{width:50px;padding:4px;margin-right:6px;}
.complete-input{padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;min-width:140px;}
.sopa-flex{display:flex;gap:24px;flex-wrap:wrap;}
.sopa-grid{display:grid;gap:2px;background:#cbd5e1;padding:4px;border-radius:8px;width:fit-content;}
.sopa-cell{background:#fff;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem;cursor:pointer;user-select:none;}
.sopa-cell.sopa-sel{background:#bfdbfe;}
.sopa-cell.sopa-found{background:#bbf7d0;color:var(--verde);}
.sopa-lista{min-width:160px;}
.sopa-word-done{text-decoration:line-through;color:var(--verde);}
.cruci-flex{display:flex;gap:28px;flex-wrap:wrap;}
.cruci-grid{display:grid;gap:2px;background:#cbd5e1;padding:4px;border-radius:6px;width:fit-content;}
.cruci-cell{position:relative;width:2rem;height:2rem;background:#fff;}
.cruci-cell.cruci-blank{background:transparent;}
.cruci-cell input{width:100%;height:100%;border:none;text-align:center;font-weight:700;text-transform:uppercase;font-size:1rem;background:transparent;}
.cruci-cell input.cruci-ok{background:#bbf7d0;}
.cruci-cell input.cruci-bad{background:#fecaca;}
.cruci-num{position:absolute;top:0;left:2px;font-size:.55rem;color:var(--gris);}
.cruci-clues p{margin:4px 0;font-size:.9rem;}
.caso-texto{background:#eff6ff;border-left:4px solid var(--azul);padding:14px 18px;border-radius:6px;line-height:1.6;}
textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:.95rem;}
.foro-post{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:14px;}
.foro-comentario{background:#fff;border-radius:6px;padding:6px 10px;margin:6px 0;font-size:.88rem;}
.foro-nuevo-comentario{display:flex;gap:8px;margin-top:8px;}
.foro-nuevo-comentario input{flex:1;padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;}
canvas{background:#fff;border:2px solid #cbd5e1;border-radius:10px;display:block;margin:10px 0;max-width:100%;}
.game-quiz{background:#fff7ed;border:2px solid #f59e0b;border-radius:10px;padding:16px;margin:10px 0;}
.game-quiz button{display:block;width:100%;text-align:left;margin:4px 0;}
.ok{color:var(--verde);font-weight:700;}
.bad{color:var(--rojo);font-weight:700;}
.cert-container{margin-top:20px;}
.cert{border:10px double var(--azul-osc);padding:40px;text-align:center;border-radius:10px;background:#fffdf5;}
.cert h2{border:none;color:var(--azul-osc);font-size:1.6rem;}
.cert-nombre{font-size:1.6rem;font-weight:700;color:var(--azul-osc);margin:10px 0;}
.cert-titulo-curso{font-size:1.2rem;font-weight:600;}
.cert-detalle{font-size:.85rem;color:var(--gris);}
.docente-fila{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;margin-bottom:8px;}
.docente-detalle{margin-top:8px;background:#f8fafc;padding:10px;border-radius:6px;font-size:.9rem;}
@media print{
  body.printing-cert > *:not(#app) , body.printing-cert #app > *:not(.paso-wrap){display:none !important;}
  body.printing-cert .paso-wrap > *:not(#certContainer){display:none !important;}
  body.printing-cert .nav-footer, body.printing-cert #btnCert{display:none !important;}
}

</style>

    <p>Cuando una persona compra, vende o de cualquier otra forma <strong>traspasa</strong> un bien inmueble (una casa, un lote, una finca), ese acto está sujeto al <strong>impuesto sobre traspasos de bienes inmuebles</strong>, un tributo administrado por el Ministerio de Hacienda que grava el cambio de propietario registrado ante el Registro Nacional.</p>
    <h3>2. Contextualización y obligados al pago</h3>
    <p>La normativa establece con claridad quiénes son las personas <strong>obligadas</strong> a pagar este impuesto en cada traspaso, generalmente relacionadas con las partes que intervienen en la escritura de traspaso (compradora, vendedora, o ambas según el caso), y el contexto legal que da origen a la obligación tributaria.</p>

    <p>El monto del impuesto se determina aplicando un <strong>cálculo vigente</strong> sobre el valor del inmueble traspasado, según lo establecido por el Ministerio de Hacienda. Sin embargo, existen <strong>casos exceptuados</strong> en los que, por disposición legal, ciertos traspasos no generan la obligación de pagar este impuesto (por ejemplo, algunos traspasos entre entidades públicas o bajo condiciones específicas señaladas en la normativa).</p>

<script>
/* ============================================================
   MOTOR DE CURSO INTERACTIVO — reutilizado por los 3 cursos
   Requiere que exista un objeto global CONFIG (definido antes de
   cargar este script) con la forma documentada en config_template.js
   ============================================================ */
(function(){
'use strict';

const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzMGf_Gpf6UWswFPSqEBMdq-93GxGkrURsT4jtO9Jaz8yT5gyMMtp1btlcDZjRCeuAb/exec";
const TEACHER_PIN = "9986";
const MODULE_ID = CONFIG.moduleId;
const STEPS = CONFIG.steps; // array of {key, label}
let studentName = "";
let progress = {};
STEPS.forEach(s=>{ if(s.key!=='cert') progress[s.key]=false; });
let currentIdx = 0;
let vidasAventura = 3;

/* ---------- utilidades sheet ---------- */
function jsonpRequest(url){
  return new Promise((resolve,reject)=>{
    const cbName = 'cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    window[cbName] = function(data){
      resolve(data);
      delete window[cbName];
      script.remove();
    };
    script.onerror = function(){ reject(new Error('jsonp error')); delete window[cbName]; script.remove(); };
    script.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(window[cbName]){ resolve({rows:[]}); delete window[cbName]; script.remove(); } }, 8000);
  });
}
function sheetGet(sheetName){
  return jsonpRequest(SHEET_API_URL + '?sheet=' + encodeURIComponent(sheetName))
    .then(d=> (d && d.rows) ? d.rows : []);
}
function sheetPost(sheetName, row){
  const body = new URLSearchParams();
  body.set('sheet', sheetName);
  Object.keys(row).forEach(k=>body.set(k, row[k]));
  return fetch(SHEET_API_URL, { method:'POST', mode:'no-cors', body });
}
function sheetDelete(sheetName, matchField, matchValue){
  const body = new URLSearchParams();
  body.set('action','delete');
  body.set('sheet', sheetName);
  body.set('matchField', matchField);
  body.set('matchValue', matchValue);
  return fetch(SHEET_API_URL, { method:'POST', mode:'no-cors', body });
}

/* ---------- arranque / anti-repetición ---------- */
function checkExisting(name){
  return sheetGet('Progreso').then(rows=>{
    return rows.some(r => String(r.Estudiante).trim().toLowerCase()===name.trim().toLowerCase()
                        && String(r.Modulo).trim()===MODULE_ID
                        && String(r.Score).trim()===String(STEPS.length-1)+'/completo');
  });
}

function initModule(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="portada">
      <h1>${CONFIG.titulo}</h1>
      <p class="subtitulo">${CONFIG.subtitulo}</p>
      <div class="portada-caja">
        <label for="inpNombre">Nombre completo del estudiante:</label>
        <input id="inpNombre" type="text" placeholder="Nombre y apellidos" autocomplete="off">
        <button id="btnComenzar" class="btn-primario">Comenzar curso</button>
        <p class="aviso">Este curso tiene una duración estimada de 4 horas e incluye actividades evaluadas, juegos y un certificado final. Solo puede completarse una vez.</p>
      </div>
      <button id="btnDocente" class="btn-link">Panel docente</button>
    </div>`;
  document.getElementById('btnComenzar').addEventListener('click', async ()=>{
    const name = document.getElementById('inpNombre').value.trim();
    if(!name){ alert('Por favor escriba su nombre completo.'); return; }
    const btn = document.getElementById('btnComenzar');
    btn.disabled = true; btn.textContent = 'Verificando...';
    let yaHizo = false;
    try{ yaHizo = await checkExisting(name); }catch(e){ yaHizo = false; }
    if(yaHizo){
      alert('Ya existe un intento completo registrado para este nombre. Si necesita repetir el curso, pida a su docente que reinicie su intento en el panel docente.');
      btn.disabled = false; btn.textContent = 'Comenzar curso';
      return;
    }
    studentName = name;
    monitorSalidaPantalla();
    renderProgBar();
    showStep(STEPS[0].key);
  });
  document.getElementById('btnDocente').addEventListener('click', openTeacherPanel);
}

/* ---------- navegación ---------- */
function renderProgBar(){
  let bar = document.getElementById('progBarWrap');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'progBarWrap';
    bar.className = 'progbar-wrap';
    document.body.insertBefore(bar, document.getElementById('app'));
  }
  const total = STEPS.length - 1;
  const done = STEPS.filter(s=>s.key!=='cert' && progress[s.key]).length;
  const pct = Math.round((done/total)*100);
  bar.innerHTML = `<div class="progbar-track"><div class="progbar-fill" style="width:${pct}%"></div></div>
    <div class="progbar-text">${CONFIG.titulo} — ${studentName} · ${done}/${total} actividades completas</div>`;
}

function allDone(){ return STEPS.filter(s=>s.key!=='cert').every(s=>progress[s.key]); }

function markDone(key){
  progress[key] = true;
  renderProgBar();
  sheetPost('Progreso', {
    Timestamp: new Date().toISOString(),
    Estudiante: studentName,
    Modulo: MODULE_ID + '_' + key + '_paso',
    Score: 'ok', Total: '1'
  });
  if(allDone()){
    sheetPost('Progreso', {
      Timestamp: new Date().toISOString(),
      Estudiante: studentName,
      Modulo: MODULE_ID,
      Score: (STEPS.length-1)+'/completo', Total: String(STEPS.length-1)
    });
    showStep('cert');
  }
}

function idxOf(key){ return STEPS.findIndex(s=>s.key===key); }

function showStep(key){
  currentIdx = idxOf(key);
  const app = document.getElementById('app');
  const step = STEPS[currentIdx];
  const wrap = document.createElement('div');
  wrap.className = 'paso-wrap';
  app.innerHTML = '';
  app.appendChild(wrap);
  const renderers = {
    antologia: renderAntologiaStep, mc: renderMcStep, asocie: renderAsocieStep,
    complete: renderCompleteStep, sopa: renderSopaStep, cruci: renderCruciStep,
    caso: renderCasoStep, dino: renderDinoStep, aventura: renderAventuraStep,
    cert: renderCertStep
  };
  renderers[step.type || key](wrap);
  if(key!=='cert') navFooter(wrap, key);
  window.scrollTo(0,0);
}

function navFooter(wrap, currentKey){
  const foot = document.createElement('div');
  foot.className = 'nav-footer';
  const idx = idxOf(currentKey);
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '← Anterior';
  prevBtn.className = 'btn-secundario';
  prevBtn.style.visibility = idx<=0 ? 'hidden':'visible';
  prevBtn.addEventListener('click', ()=> showStep(STEPS[idx-1].key));
  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Siguiente →';
  nextBtn.className = 'btn-secundario';
  nextBtn.id = 'navNextBtn';
  nextBtn.style.visibility = idx>=STEPS.length-1 ? 'hidden':'visible';
  nextBtn.addEventListener('click', ()=> showStep(STEPS[idx+1].key));
  foot.appendChild(prevBtn); foot.appendChild(nextBtn);
  wrap.appendChild(foot);
}

/* ---------- 5. Sopa de letras ---------- */
function generarSopa(words, size){
  const grid = Array.from({length:size}, ()=>Array(size).fill(null));
  const dirs = [[0,1],[1,0],[1,1],[-1,1]];
  const placed = [];
  words.forEach(word=>{
    let ok = false, tries = 0;
    while(!ok && tries<200){
      tries++;
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const row0 = Math.floor(Math.random()*size);
      const col0 = Math.floor(Math.random()*size);
      const endRow = row0 + dir[0]*(word.length-1);
      const endCol = col0 + dir[1]*(word.length-1);
      if(endRow<0||endRow>=size||endCol<0||endCol>=size) continue;
      let fits = true;
      for(let k=0;k<word.length;k++){
        const r = row0+dir[0]*k, c = col0+dir[1]*k;
        if(grid[r][c] !== null && grid[r][c] !== word[k]){ fits=false; break; }
      }
      if(!fits) continue;
      for(let k=0;k<word.length;k++){
        const r = row0+dir[0]*k, c = col0+dir[1]*k;
        grid[r][c] = word[k];
      }
      placed.push({word, row0, col0, dir});
      ok = true;
    }
  });
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(grid[r][c]===null) grid[r][c] = letras[Math.floor(Math.random()*letras.length)];
  return {grid, placed};
}

let sopaState = null;
function renderSopaStep(wrap){
  const nStep = idxOf('sopa')+1;
  const size = CONFIG.sopa.size || 12;
  const {grid, placed} = generarSopa(CONFIG.sopa.words.map(w=>w.toUpperCase()), size);
  sopaState = { grid, placed, found:new Set(), selecting:null };
  window.__sopaState = sopaState; // expuesto solo para pruebas automatizadas
  wrap.innerHTML = `<h2>${nStep}. Sopa de letras</h2>
    <p>Encuentre las ${placed.length} palabras. Haga clic en la primera letra y luego en la última letra de cada palabra.</p>
    <div class="sopa-flex">
      <div id="sopaGrid" class="sopa-grid" style="grid-template-columns:repeat(${size},1fr)"></div>
      <div id="sopaLista" class="sopa-lista"></div>
    </div>
    <p id="sopaResultado" class="resultado"></p>`;
  const gridDiv = document.getElementById('sopaGrid');
  const cells = [];
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const cell = document.createElement('div');
      cell.className = 'sopa-cell';
      cell.textContent = grid[r][c];
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('click', ()=> onSopaCellClick(r,c,cells));
      gridDiv.appendChild(cell);
      cells.push(cell);
    }
  }
  const lista = document.getElementById('sopaLista');
  lista.innerHTML = '<h4>Palabras</h4>' + CONFIG.sopa.words.map(w=>`<p data-word="${w.toUpperCase()}" class="sopa-word">${w}</p>`).join('');
  checkSopaComplete();
}
function cellAt(cells,r,c,size){ return cells[r*size+c]; }
function onSopaCellClick(r,c, cells){
  const size = CONFIG.sopa.size || 12;
  const st = sopaState;
  const cell = cellAt(cells,r,c,size);
  if(!st.selecting){
    st.selecting = {r,c};
    cell.classList.add('sopa-sel');
    return;
  }
  const start = st.selecting;
  st.selecting = null;
  cells.forEach(cc=>cc.classList.remove('sopa-sel'));
  if(start.r===r && start.c===c) return;
  const dr = Math.sign(r-start.r), dc = Math.sign(c-start.c);
  const match = st.placed.find(p=>{
    if(p.dir[0]!==dr || p.dir[1]!==dc) return false;
    const endR = p.row0 + p.dir[0]*(p.word.length-1);
    const endC = p.col0 + p.dir[1]*(p.word.length-1);
    return (p.row0===start.r && p.col0===start.c && endR===r && endC===c);
  });
  if(match && !st.found.has(match.word)){
    st.found.add(match.word);
    for(let k=0;k<match.word.length;k++){
      const rr = match.row0+match.dir[0]*k, cc = match.col0+match.dir[1]*k;
      cellAt(cells,rr,cc,size).classList.add('sopa-found');
    }
    const li = document.querySelector(`.sopa-word[data-word="${match.word}"]`);
    if(li) li.classList.add('sopa-word-done');
    checkSopaComplete();
  }
}
function checkSopaComplete(){
  const el = document.getElementById('sopaResultado');
  if(!el) return;
  const total = sopaState.placed.length;
  const found = sopaState.found.size;
  el.textContent = `Encontradas: ${found}/${total}`;
  if(found>=total){
    el.textContent += ' ¡Completado!';
    markDone('sopa');
  }
}

/* ---------- 6. Crucigrama ---------- */
function buildCruciCellMap(){
  const map = {}; // key "r,c" -> {letter, cells refs later}
  CONFIG.cruci.words.forEach(w=>{
    for(let k=0;k<w.word.length;k++){
      const r = w.row + (w.dir==='v'?k:0);
      const c = w.col + (w.dir==='h'?k:0);
      const key = r+','+c;
      map[key] = { letter: w.word[k].toUpperCase() };
    }
  });
  return map;
}
function renderCruciStep(wrap){
  const nStep = idxOf('cruci')+1;
  const size = CONFIG.cruci.size;
  const cellMap = buildCruciCellMap();
  wrap.innerHTML = `<h2>${nStep}. Crucigrama</h2>
    <div class="cruci-flex">
      <div id="cruciGrid" class="cruci-grid" style="grid-template-columns:repeat(${size.cols},2rem)"></div>
      <div id="cruciClues" class="cruci-clues"></div>
    </div>
    <button id="btnCruciCheck" class="btn-primario">Comprobar</button>
    <p id="cruciResultado" class="resultado"></p>`;
  const gridDiv = document.getElementById('cruciGrid');
  const numberStarts = {};
  CONFIG.cruci.words.forEach(w=>{ numberStarts[w.row+','+w.col] = w.num; });
  for(let r=0;r<size.rows;r++){
    for(let c=0;c<size.cols;c++){
      const key = r+','+c;
      const td = document.createElement('div');
      if(cellMap[key]){
        td.className = 'cruci-cell';
        td.dataset.r = r; td.dataset.c = c;
        td.dataset.answer = cellMap[key].letter;
        if(numberStarts[key]){
          const num = document.createElement('span');
          num.className = 'cruci-num'; num.textContent = numberStarts[key];
          td.appendChild(num);
        }
        const input = document.createElement('input');
        input.maxLength = 1;
        input.addEventListener('input', (e)=>{ e.target.value = e.target.value.toUpperCase().slice(-1); });
        td.appendChild(input);
      } else {
        td.className = 'cruci-cell cruci-blank';
      }
      gridDiv.appendChild(td);
    }
  }
  const clues = document.getElementById('cruciClues');
  clues.innerHTML = '<h4>Pistas</h4>' + CONFIG.cruci.words.map(w=>
    `<p><strong>${w.num}${w.dir==='h'?'H':'V'}.</strong> ${w.clue}</p>`).join('');
  document.getElementById('btnCruciCheck').addEventListener('click', ()=>{
    const cellDivs = gridDiv.querySelectorAll('.cruci-cell:not(.cruci-blank)');
    let total = cellDivs.length, correctas = 0;
    cellDivs.forEach(td=>{
      const input = td.querySelector('input');
      const ok = input.value.trim().toUpperCase() === td.dataset.answer;
      input.classList.toggle('cruci-ok', ok);
      input.classList.toggle('cruci-bad', !ok && input.value.trim()!=='');
      if(ok) correctas++;
    });
    const pct = Math.round((correctas/total)*100);
    document.getElementById('cruciResultado').textContent = `Casillas correctas: ${correctas}/${total} (${pct}%).`;
    if(correctas===total){ markDone('cruci'); document.getElementById('cruciResultado').textContent += ' ¡Crucigrama completo!'; }
  });
}

function commentKey(){ return MODULE_ID+'_comentario'; }
function renderCasoStep(wrap){
  const nStep = idxOf('caso')+1;

    <p id="casoResultado" class="resultado"></p>
    <hr>
    <h3>Foro: respuestas de sus compañeros</h3>

  loadForo();
  document.getElementById('btnCasoEnviar').addEventListener('click', ()=>{

function loadForo(){
  const box = document.getElementById('foroLista');
  Promise.all([sheetGet('Casos')]).then(([rows])=>{
    const posts = rows.filter(r=>String(r.CasoId).trim()===caseKey());
    const comments = rows.filter(r=>String(r.CasoId).trim()===commentKey());
    if(!box) return;
    if(posts.length===0){ box.innerHTML = '<p>Aún no hay respuestas publicadas. ¡Sea el primero!</p>'; return; }
    box.innerHTML = posts.map(p=>{
      const nombre = p.Nombre;
      const misComentarios = comments.filter(c=> String(c.Texto).startsWith('→'+nombre+'|'));
      const comentariosHtml = misComentarios.map(c=>{
        const txt = String(c.Texto).split('|').slice(1).join('|');
        return `<div class="foro-comentario"><strong>${c.Nombre||'Compañero/a'}:</strong> ${txt}</div>`;
      }).join('');
      return `<div class="foro-post">
        <p><strong>${nombre}</strong> escribió:</p>
        <p>${p.Texto}</p>
        <div class="foro-comentarios">${comentariosHtml}</div>
        <div class="foro-nuevo-comentario">
          <input type="text" placeholder="Comentar la respuesta de ${nombre}..." data-target="${nombre}">
          <button class="btn-secundario foro-btn-comentar" data-target="${nombre}">Comentar</button>
        </div>
      </div>`;
    }).join('');
    box.querySelectorAll('.foro-btn-comentar').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const target = btn.dataset.target;
        const input = box.querySelector(`input[data-target="${CSS.escape(target)}"]`);
        enviarComentario(input, target);
      });
    });
  });
}
function enviarComentario(input, target){
  const texto = input.value.trim();
  if(!texto) return;
  sheetPost('Casos', { Timestamp: new Date().toISOString(), CasoId: commentKey(), Nombre: studentName, Texto: '→'+target+'|'+texto });
  input.value = '';
  input.disabled = true;
  setTimeout(loadForo, 1000);
}

/* ---------- 8. Juego del dinosaurio ---------- */
function renderDinoStep(wrap){
  const nStep = idxOf('dino')+1;
  wrap.innerHTML = `<h2>${nStep}. Juego: Corre y responde</h2>
    <p>Presione ESPACIO o toque la pantalla para saltar los obstáculos. Cada cierto tramo aparecerá una pregunta: respóndala bien para seguir corriendo.</p>
    <canvas id="dinoCanvas" width="700" height="220"></canvas>
    <div id="dinoOverlay"></div>
    <p id="dinoResultado" class="resultado"></p>`;
  const canvas = document.getElementById('dinoCanvas');
  const ctx = canvas.getContext('2d');
  let player = {x:50,y:170,w:24,h:30,vy:0,jumping:false};
  const groundY = 200;
  let obstacles = [];
  let frame = 0;
  let speed = 4;
  let distance = 0;
  let paused = false;
  let quizPending = false;
  let running = true;
  let nextQuizAt = 400;

  function spawnObstacle(){
    obstacles.push({x:canvas.width, w:16+Math.random()*10, h:20+Math.random()*20});
  }
  function jump(){
    if(!player.jumping && !paused){ player.vy = -10; player.jumping = true; }
  }
  window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); jump(); } });
  canvas.addEventListener('click', jump);

  function showDinoQuiz(){
    paused = true; quizPending = true;
    const pool = CONFIG.gameQuestions;
    const q = pool[Math.floor(Math.random()*pool.length)];
    const overlay = document.getElementById('dinoOverlay');
    overlay.innerHTML = `<div class="game-quiz"><p>${q.q}</p>` +
      q.opciones.map((op,j)=>`<button class="btn-secundario dino-opt" data-i="${j}">${op}</button>`).join('') + `</div>`;
    overlay.querySelectorAll('.dino-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ok = parseInt(btn.dataset.i,10)===q.correcta;
        overlay.innerHTML = `<p class="${ok?'ok':'bad'}">${ok?'¡Correcto! Continúa corriendo.':'Incorrecto. Intente de nuevo más adelante.'}</p>`;
        setTimeout(()=>{ overlay.innerHTML=''; paused=false; quizPending=false; nextQuizAt = distance+300+Math.random()*200; }, 900);
      });
    });
  }

  function loop(){
    if(!running) return;
    if(!paused){
      frame++;
      distance += speed;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#eef6ff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#334155'; ctx.fillRect(0, groundY+player.h, canvas.width, 4);
      player.vy += 0.6; player.y += player.vy;
      if(player.y > 170){ player.y = 170; player.vy=0; player.jumping=false; }
      ctx.fillStyle = '#2563eb'; ctx.fillRect(player.x, player.y, player.w, player.h);
      if(frame%90===0) spawnObstacle();
      obstacles.forEach(o=> o.x -= speed);
      obstacles = obstacles.filter(o=>o.x> -30);
      ctx.fillStyle = '#dc2626';
      obstacles.forEach(o=> ctx.fillRect(o.x, groundY+player.h-o.h, o.w, o.h));
      obstacles.forEach(o=>{
        if(player.x < o.x+o.w && player.x+player.w > o.x && player.y+player.h > groundY+player.h-o.h){
          distance = Math.max(0, distance-60);
        }
      });
      ctx.fillStyle = '#0f172a';
      ctx.font = '14px sans-serif';
      ctx.fillText('Distancia: '+Math.floor(distance)+' m', 10, 20);
      if(distance >= nextQuizAt && !quizPending){ showDinoQuiz(); }
      if(distance >= 2000){
        running = false;
        document.getElementById('dinoResultado').textContent = '¡Meta alcanzada! Actividad completada.';
        markDone('dino');
        return;
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* ---------- 9. Juego de aventura (plataformas) ---------- */
function renderAventuraStep(wrap){
  const nStep = idxOf('aventura')+1;
  wrap.innerHTML = `<h2>${nStep}. Juego de aventura</h2>
    <p>Use las flechas ← → para moverse y ↑ o ESPACIO para saltar. Recoja todas las monedas y llegue a la bandera. Cuidado con los obstáculos: le harán perder una vida y deberá responder una pregunta para recuperarla.</p>
    <canvas id="avCanvas" width="700" height="300"></canvas>
    <div id="avOverlay"></div>
    <p id="avEstado">Vidas: <span id="avVidas">3</span> · Monedas: <span id="avMonedas">0</span>/<span id="avMonedasTotal">0</span></p>
    <p id="avResultado" class="resultado"></p>`;
  const canvas = document.getElementById('avCanvas');
  const ctx = canvas.getContext('2d');
  const platforms = [
    {x:0,y:270,w:700,h:30},
    {x:150,y:210,w:100,h:14},
    {x:320,y:170,w:100,h:14},
    {x:480,y:210,w:100,h:14},
    {x:600,y:150,w:80,h:14}
  ];
  const coins = [
    {x:190,y:180,r:8,got:false},
    {x:360,y:140,r:8,got:false},
    {x:520,y:180,r:8,got:false},
    {x:630,y:120,r:8,got:false},
    {x:40,y:240,r:8,got:false}
  ];
  const obstacles = [ {x:260,y:255,w:16,h:16}, {x:430,y:255,w:16,h:16} ];
  document.getElementById('avMonedasTotal').textContent = coins.length;
  let vidas = 3;
  let flag = {x:660,y:100,w:20,h:50};
  let player = {x:20,y:230,w:20,h:30,vx:0,vy:0,onGround:false};
  const keys = {};
  let paused = false, running = true;
  function keydown(e){ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); }
  function keyup(e){ keys[e.code]=false; }
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);

  function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  function showAvQuiz(onResolved){
    paused = true;
    const pool = CONFIG.gameQuestions;
    const q = pool[Math.floor(Math.random()*pool.length)];
    const overlay = document.getElementById('avOverlay');
    overlay.innerHTML = `<div class="game-quiz"><p>${q.q}</p>` +
      q.opciones.map((op,j)=>`<button class="btn-secundario av-opt" data-i="${j}">${op}</button>`).join('') + `</div>`;
    overlay.querySelectorAll('.av-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ok = parseInt(btn.dataset.i,10)===q.correcta;
        overlay.innerHTML = `<p class="${ok?'ok':'bad'}">${ok?'¡Correcto! Recupera una vida.':'Incorrecto.'}</p>`;
        if(ok) vidas = Math.min(3, vidas+1);
        document.getElementById('avVidas').textContent = vidas;
        setTimeout(()=>{ overlay.innerHTML=''; paused=false; onResolved && onResolved(); }, 800);
      });
    });
  }

  function loop(){
    if(!running) return;
    if(!paused){
      if(keys['ArrowLeft']) player.vx = -3;
      else if(keys['ArrowRight']) player.vx = 3;
      else player.vx = 0;
      if((keys['ArrowUp']||keys['Space']) && player.onGround){ player.vy = -9; player.onGround=false; }
      player.vy += 0.5;
      player.x += player.vx; player.y += player.vy;
      player.onGround = false;
      platforms.forEach(p=>{
        if(player.x < p.x+p.w && player.x+player.w > p.x && player.y+player.h > p.y && player.y+player.h < p.y+p.h+12 && player.vy>=0){
          player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        }
      });
      if(player.x<0) player.x=0;
      if(player.x+player.w>canvas.width) player.x = canvas.width-player.w;
      if(player.y>canvas.height){ player.x=20; player.y=230; }
      coins.forEach(c=>{
        if(!c.got && Math.hypot((player.x+player.w/2)-c.x, (player.y+player.h/2)-c.y) < c.r+16){
          c.got = true;
          document.getElementById('avMonedas').textContent = coins.filter(cc=>cc.got).length;
        }
      });
      obstacles.forEach(o=>{
        if(rectsOverlap(player,o)){
          vidas--;
          document.getElementById('avVidas').textContent = vidas;
          player.x = 20; player.y = 230; player.vy=0;
          if(vidas<=0){
            showAvQuiz(()=>{ vidas=1; document.getElementById('avVidas').textContent=vidas; });
          }
        }
      });
      if(coins.every(c=>c.got) && rectsOverlap(player, flag)){
        running = false;
        document.getElementById('avResultado').textContent = '¡Meta alcanzada con todas las monedas! Actividad completada.';
        markDone('aventura');
        return;
      }
    }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#f0fdf4'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#166534';
    platforms.forEach(p=> ctx.fillRect(p.x,p.y,p.w,p.h));
    ctx.fillStyle = '#facc15';
    coins.forEach(c=>{ if(!c.got){ ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill(); } });
    ctx.fillStyle = '#dc2626';
    obstacles.forEach(o=>{
      ctx.beginPath(); ctx.moveTo(o.x,o.y+o.h); ctx.lineTo(o.x+o.w/2,o.y); ctx.lineTo(o.x+o.w,o.y+o.h); ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = coins.every(c=>c.got) ? '#16a34a' : '#94a3b8';
    ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    requestAnimationFrame(loop);
  }
  loop();
}

/* ---------- 10. Certificado ---------- */

  wrap.innerHTML = `<h2>¡Curso completado!</h2>

      sheetPost('Progreso', {
        Timestamp: new Date().toISOString(), Estudiante: studentName,

      });

/* ---------- panel docente ---------- */
function openTeacherPanel(){
  const pin = prompt('PIN del panel docente:');
  if(pin !== TEACHER_PIN){ if(pin!==null) alert('PIN incorrecto.'); return; }
  const app = document.getElementById('app');
  app.innerHTML = `<h2>Panel docente — ${CONFIG.titulo}</h2>
    <button id="btnVolverPortada" class="btn-secundario">← Volver</button>
    <div id="listaEstudiantes">Cargando...</div>`;
  document.getElementById('btnVolverPortada').addEventListener('click', initModule);
  Promise.all([sheetGet('Progreso'), sheetGet('Casos')]).then(([prog, casos])=>{
    const completos = prog.filter(r=> String(r.Modulo).trim()===MODULE_ID);
    const nombres = [...new Set(completos.map(r=>r.Estudiante))];
    const box = document.getElementById('listaEstudiantes');
    if(nombres.length===0){ box.innerHTML = '<p>Aún no hay estudiantes que hayan completado el curso.</p>'; return; }
    box.innerHTML = nombres.map(n=>{
      const casoRow = casos.find(c=> String(c.CasoId).trim()===caseKey() && c.Nombre===n);
      return `<div class="docente-fila">
        <strong>${n}</strong>
        <button class="btn-secundario btn-ver-caso" data-n="${n}">Ver caso</button>
        <button class="btn-secundario btn-repetir" data-n="${n}">🔄 Repetir</button>
        <div class="docente-detalle" id="detalle-${cssId(n)}" style="display:none">${casoRow? casoRow.Texto : '(sin respuesta registrada)'}</div>
      </div>`;
    }).join('');
    box.querySelectorAll('.btn-ver-caso').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const d = document.getElementById('detalle-'+cssId(btn.dataset.n));
        d.style.display = d.style.display==='none' ? 'block':'none';
      });
    });
    box.querySelectorAll('.btn-repetir').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const n = btn.dataset.n;
        if(!confirm(`¿Reiniciar el intento de ${n}? Podrá volver a realizar el curso.`)) return;
        Promise.all([
          sheetDelete('Progreso','Estudiante',n),
          sheetDelete('Casos','Nombre',n)
        ]).then(()=>{ alert('Intento reiniciado.'); openTeacherPanel(); });
      });
    });
  });
}
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }

document.addEventListener('DOMContentLoaded', initModule);
window.__engineExports = { generarSopa, buildCruciCellMap }; // para pruebas
})();
